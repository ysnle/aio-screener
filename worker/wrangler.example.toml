name = "aio-screener-data-plane"
main = "data-plane.js"
compatibility_date = "2026-07-18"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 0.1

[triggers]
# The worker wakes every five minutes for the workflow dispatches; data-plane.js
# publishes quotes on every slot only while a US or KRX session is open (every
# 30 minutes otherwise), suppresses unchanged current writes and throttles
# liveness heartbeats to 15 minutes.
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://ysnle.github.io"
AIO_SOURCE_SHA = "__AIO_SOURCE_SHA__"

[[kv_namespaces]]
binding = "AIO_QUOTES_KV"
id = "__AIO_QUOTES_KV_ID__"

# Set with `wrangler secret put AIO_CRON_SECRET`; never commit the value.
