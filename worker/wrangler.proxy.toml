name = "aio-proxy"
main = "../cloudflare-worker-proxy.js"
compatibility_date = "2026-08-10"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
AI_DAILY_CAP = "300"
# P1759: each browser connection (HMAC of UTC day + IP, IPv6 grouped by /64; raw IPs never stored) gets at
# most this many AI requests per UTC day inside the same DO admission. Bounded 1-1000 and clamped to
# AI_DAILY_CAP. Authenticated GitHub Actions requests are not per-client limited. Optional secret
# AI_CLIENT_KEY_SALT separates the client-key HMAC from OPENAI_API_KEY (the fallback key material).
# v57.61: 200 (2/3 of the day). Retries of one question no longer count; the $20 month stays the hard stop.
AI_PER_CLIENT_DAILY_CAP = "200"
# P1421: all AIO browser + GitHub Actions AI shares one UTC-month authority.
# Reserve worst input/output cost before dispatch, settle only verified usage.
# Failed/cancelled/unknown usage retains its full reservation. Never an invoice.
# A dedicated OpenAI project/key must not be used outside this Worker.
AI_MONTHLY_BUDGET_USD = "20"
# P1608: conditional search is metered by the same authority, max 2 calls.
AI_WEB_SEARCH_ENABLED = "true"
# P1433 (owner, 2026-10-04): October 2026 prior spend on this OpenAI path was $0 (the new route never
# served before this date); clears the P1353 unknown-month block once. Ignored for other months.
AI_LEGACY_MONTH_ACK = "2026-10:0"
# P1740 (2026-10-13): analysis/comparison answers request up to 8000 output tokens (reasoning included); the
# reservation grows by at most 4000 x $0.55/1M per call, inside the same $20 monthly admission budget.
# v57.61: medium-effort analysis spends reasoning inside this cap; 16000 x $0.55/1M = $0.0088 reserved per call.
AI_MAX_OUTPUT_TOKENS = "16000"
# Per-provider daily ceiling for /relay (operator-key server-side fetches).
RELAY_DAILY_CAP = "2000"
# Must equal version.json — enforced by ci-version-check.mjs and synchronized by bump-version.mjs.
AIO_APP_REVISION = "v58.17"
AIO_SOURCE_SHA = "__AIO_SOURCE_SHA__"

# 2026-10-14: Workers AI for headline translation (/workers-ai/translate, automation token only).
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AIO_QUOTA_DO"
class_name = "AIOQuotaDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AIOQuotaDurableObject"]

# ── Cloudflare-native rate limiting (v56, P1157) ────────────────────────────────────────────
# The Worker's module-local `Map` is per-isolate: its real ceiling is
# `limit × distinct IPs × live isolates`. These bindings are backed by the same infrastructure
# that serves WAF rate limiting rules, so the counters are shared by every isolate within one
# Cloudflare location. That matters here because `workers.dev` has no zone, so a zone-level WAF
# rate limiting rule is NOT available for this deployment.
#
# Two honest limits remain: a binding is per Cloudflare location (not global), and it is
# eventually consistent by design. It is a stronger bound, not an accounting system.
# The Durable Object daily caps (AI_DAILY_CAP / RELAY_DAILY_CAP) stay the global authority.
#
# `namespace_id` must be a positive integer, unique per Cloudflare account; bindings that share
# one share their counters (deliberate, so a limit can span Workers) — do not reuse these three.
# `period` must be either 10 or 60. Bindings are not visible in the Cloudflare dashboard; observe
# them through Workers Logs (429s) instead.
# Requires wrangler >= 4.36.0 (deploy-ai-proxy.yml installs 4.120.0).
[[ratelimits]]
name = "RATE_LIMIT_PROXY"
namespace_id = "1001"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "RATE_LIMIT_OPENAI"
namespace_id = "1002"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RATE_LIMIT_RELAY"
namespace_id = "1003"
[ratelimits.simple]
limit = 60
period = 60

# Secrets injected with `wrangler secret put` by deploy-ai-proxy.yml:
#   OPENAI_API_KEY      — shared GPT-6 Luna route (/openai)
#   AIO_AUTOMATION_TOKEN — 32+ chars; authenticated originless Actions requests
# v57.79: the personal-key FRED /relay provider was retired; FRED_API_KEY stays an Actions-only secret.
#   BOK_API_KEY        — /relay provider "bok"   (ecos.bok.or.kr)
#   KOSIS_API_KEY      — /relay provider "kosis"
# A provider whose key is absent makes only that relay provider fail closed (503);
# BOK/KOSIS never fall back to a client-supplied key.
# AIO_APP_TOKEN and AIO_DEV_ORIGINS remain optional operator-managed settings.
# Optional private quota observation uses the Cloudflare Worker secret AIO_OPERATOR_TOKEN;
# it is deliberately excluded from public /health and is not synchronized from repository secrets.
