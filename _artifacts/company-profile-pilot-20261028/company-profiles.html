<style>
/* Layout: AI value-chain rail on the left, one company told top to bottom as a single money-and-strategy story. */
:root {
  --bg: #faf9f2; --card: #fdfdfc; --ink: #3b352b; --muted: #71624b; --line: #e4dccb; --line-strong: #cfc4ab;
  --accent: #8c6b2f; --accent-soft: #f2ead7; --accent-ink: #fdfdfc; --up: #c4352b; --down: #2a5bb8; --ok: #2f7a4a; --warn: #a26a0f;
  --u1: #8c6b2f; --u2: #b98d45; --u3: #5d7a58; --u4: #4e6f8f; --u5: #9a5a4a; --u6: #7a6a9a; --u7: #8f8a7c;
  --f-display: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
  --f-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a17; --card: #232219; --ink: #ece6dc; --muted: #c9b89e; --line: #3b382e; --line-strong: #555040;
  --accent: #d9b56f; --accent-soft: #302a1c; --accent-ink: #1b1a17; --up: #f07a6e; --down: #7aa5f5; --ok: #6cc48b; --warn: #e2ad4c;
  --u1: #d9b56f; --u2: #e6c98f; --u3: #8fb889; --u4: #8fb0d3; --u5: #d8907d; --u6: #b3a3d6; --u7: #b5ae9c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1a17; --card: #232219; --ink: #ece6dc; --muted: #c9b89e; --line: #3b382e; --line-strong: #555040;
  --accent: #d9b56f; --accent-soft: #302a1c; --accent-ink: #1b1a17; --up: #f07a6e; --down: #7aa5f5; --ok: #6cc48b; --warn: #e2ad4c;
  --u1: #d9b56f; --u2: #e6c98f; --u3: #8fb889; --u4: #8fb0d3; --u5: #d8907d; --u6: #b3a3d6; --u7: #b5ae9c; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: grid; gap: 6px; margin-bottom: 22px; }
h1 { font-family: var(--f-display); font-size: clamp(24px, 3vw, 30px); margin: 0; line-height: 1.35; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 12px; }
.rail .group h2 { font-size: 12px; color: var(--muted); margin: 0 0 5px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px/1.2 var(--f-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.chip:hover { border-color: var(--line-strong); }
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main.detail { min-width: 0; display: grid; gap: 30px; }
.hero { display: grid; gap: 8px; }
.hero .name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.hero h2 { font-family: var(--f-display); font-size: 26px; margin: 0; }
.hero .sym { color: var(--muted); font-size: 14px; }
.hero .one { font-size: 17px; margin: 0; max-width: 64ch; }
.tag { justify-self: start; font-size: 12.5px; border-radius: 999px; padding: 2px 11px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.step { display: grid; gap: 12px; }
.step > h3 { font-family: var(--f-display); font-size: 19px; margin: 0; }
.bridge { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.txt { margin: 0; max-width: 70ch; }
.small { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }
.cite { font-size: 10.5px; color: var(--accent); text-decoration: none; vertical-align: super; margin-left: 2px; }
.cite:hover { text-decoration: underline; }
/* value path: moat -> design -> make -> sell */
.path { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; counter-reset: node; }
.node { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 14px; display: grid; gap: 6px; align-content: start; }
.node .k::before { counter-increment: node; content: counter(node) "  "; color: var(--muted); }
.node .k { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: .02em; }
.node p { margin: 0; font-size: 13.5px; }
.node ul { margin: 0; padding-left: 1em; font-size: 13px; }
.flow { display: grid; gap: 0; background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; }
.flow .hop { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 8px; align-items: center; padding: 7px 0; font-size: 13.5px; }
.flow .hop + .hop { border-top: 1px dashed var(--line-strong); }
.flow .who { font-weight: 700; }
.flow .arrow { text-align: center; color: var(--accent); font-weight: 700; }
.flow .what { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-top: -2px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { border-top: 2px solid var(--ink); padding-top: 6px; }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .d { font-size: 12px; }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) 150px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 14px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.up { color: var(--up); } .down { color: var(--down); }
.stack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.ladder { display: grid; gap: 3px; }
.rung { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 10px; border-radius: 6px; font-size: 13px; }
.rung .lname { color: var(--muted); }
.rung .who { display: flex; flex-wrap: wrap; gap: 4px; }
.rung .who button { font: 12px/1.2 var(--f-body); background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 5px; padding: 2px 6px; cursor: pointer; }
.rung.me { background: var(--accent-soft); outline: 1px solid var(--accent); }
.rung.me .lname { color: var(--accent); font-weight: 700; }
.rung.me .who button.self { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
.pair h4, .one-col h4 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 0 0 3px; }
.pair p, .pair ul, .one-col p { margin: 0; }
ul { padding-left: 1.1em; margin: 0; } li { margin: 2px 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 560px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
.pos { font-size: 12px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line-strong); white-space: nowrap; }
.pos.leader { border-color: var(--ok); color: var(--ok); } .pos.challenger { border-color: var(--warn); color: var(--warn); }
.road { display: grid; gap: 0; border-left: 2px solid var(--accent); margin-left: 6px; }
.road .m { position: relative; padding: 4px 0 10px 18px; font-size: 13.5px; }
.road .m::before { content: ""; position: absolute; left: -7px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.road .when { display: block; font-size: 12px; color: var(--accent); font-weight: 700; }
.ok h4 { color: var(--ok) !important; } .bad h4 { color: var(--up) !important; }
.cal { display: grid; gap: 6px; }
.cal .ev { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px; font-size: 13.5px; }
.cal .when { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.gov { font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
details.fold { border-top: 1px solid var(--line); padding-top: 10px; }
details.fold summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }
ol.sources { font-size: 12.5px; padding-left: 0; list-style: none; display: grid; gap: 4px; margin: 10px 0 0; }
ol.sources li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; }
ol.sources .sid { color: var(--accent); }
ol.sources a { color: var(--ink); overflow-wrap: anywhere; }
ol.sources li.hit { background: var(--accent-soft); border-radius: 4px; }
.missing { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.rail { position: static; }
  .path { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .bar { grid-template-columns: minmax(0, 1fr) 130px; } .bar .track { grid-column: 1 / -1; grid-row: 2; }
  .rung { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .cal .ev { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
</style>

6-26"}],"moat":{"sources":["잘게 분산된 고객 기반 - 최대 고객 비중이 Retail 커미션·수수료의 0.6% (2025, 10-K)","분권형 영업 조직과 국내 47개 주 468곳·해외 15개국 246곳 사무소","프로그램(MGA)·도매 같은 전문 유통 역량 - 보험사 대신 상품을 설계·인수 대행","반복 인수합병으로 쌓은 규모 - Business Insurance 2026 세계 브로커 순위 5위"],"text":"Brown & Brown의 힘은 보험 위험을 지지 않으면서 수많은 작은 고객의 보험을 매년 갱신해 주는 반복 수수료 구조에서 나온다. 최대 고객이 Retail 커미션의 0.6%에 불과할 만큼 고객이 분산돼 있고, 전국에 흩어진 지점이 각자 영업하는 분권형 조직이 지역 고객을 붙잡는다. 여기에 보험사를 대신해 상품을 설계하는 프로그램 사업과 꾸준한 인수합병이 규모를 키워, 2026년 세계 브로커 순위 5위에 올랐다.","src":["s3","s11"]},"design":{"text":"이 기반 위에서 회사가 '설계'하는 것은 보험 상품 자체가 아니라 고객에게 맞는 보험 배치와 일부 특화 상품이다. Accession 인수 뒤 부문은 두 개로 재편됐는데, Retail은 기업·공공·전문직·개인의 손해보험·직원복리 보험 중개와 자동차 딜러용 보증상품을 맡고, Specialty Distribution은 보험사를 대신해 특정 업종 상품을 만들고 인수 대행하는 Programs(MGA/MGU)와 일반 보험사가 받지 않는 위험을 초과·잉여(E&S) 시장에 배치하는 Wholesale Brokerage로 이뤄진다. 연방 홍수보험을 대행하는 Wright National Flood 등 부수 보험 사업도 있다.","src":["s3","s6"]},"make":{"model":"service","partners":["보험사 - 실제 위험을 인수하고 보험금을 지급 (보험사별 집중도는 미공시)","E&S·재보험 시장 - 일반 보험사가 받지 않는 위험의 인수처","Programs 사업의 위임 보험사 - Brown & Brown이 대신 심사·인수 업무를 하지만 위험은 보험사가 짐","연방 홍수보험 프로그램 - Wright National Flood의 대행(write-your-own) 구조"],"text":"그래서 이 회사에서 '생산'은 보험사가 위험을 떠안고, Brown & Brown이 그 위험을 고객에 맞게 찾아 배치하거나 보험사 대신 심사하는 분업으로 이뤄진다. 위험을 지지 않으므로 큰 재해가 나도 보험금을 물지 않지만, 대신 보험사가 얼마의 가격에 얼마나 받아 주느냐에 매출이 묶인다. 실제로 2026년에는 일반 보험사들이 E&S 물건을 다시 가져가면서 도매 물량이 줄었다.","src":["s3","s4"]},"sell":{"customers":["중소·대기업 (손해보험·직원복리)","공공·준공공 기관, 전문직, 개인","자동차·RV 딜러 (보증상품)","다른 소매 중개사 (Wholesale 도매 채널)"],"channel":"Retail은 지역 지점의 직접 영업, Wholesale은 다른 중개사를 통한 도매, Programs는 대리점·중개사 네트워크를 통한 상품 유통.","concentration":"최대 고객 비중: Retail 커미션·수수료의 0.6%, Specialty Distribution의 약 7.2% (2025, 10-K). 해외 사업 매출 8.43억 달러(약 14%).","text":"이렇게 배치한 보험은 지역 지점을 통해 기업·개인에게 직접, 또는 다른 중개사를 거쳐 도매로 팔린다. 고객이 잘게 분산돼 있어 개별 이탈 위험은 작고, 2025년 해외 매출은 8.43억 달러(약 14%)로 대부분 미국이다. Q3 2026 Retail 오가닉 성장 2.6%는 신규 계약과 직원복리·보증 수요가 이끌었다.","src":["s3","s4"]},"moneyFlow":{"steps":[{"from":"기업·개인 고객","to":"보험사 (Brown & Brown 경유)","what":"보험료 - 중개사가 잠시 보 cessed date, page not fetched)","url":"https://gminsights.com/industry-analysis/data-center-generator-market/market-share","publisher":"Global Market Insights","date":"2026-10-28"},{"id":"s16","kind":"news","title":"XCMG Again Ranks Among Global Top Three in KHL Group's 2026 Yellow Table (company release)","url":"https://kyodonewsprwire.jp/release/202605048522","publisher":"XCMG via PR Newswire / Kyodo","date":"2026-05-04"}],"moat":{"sources":["세계 최대 규모의 독립 딜러·서비스망 - 미국 41곳, 해외 109곳 딜러, 190개국 (10-K FY2025)","넓은 설치 기반에서 나오는 부품·서비스 매출 - FY2025 240억 달러, 2030년 300억 달러 목표","왕복엔진(최대 약 10MW)부터 Solar Turbines 가스터빈(최대 약 39MW)까지 갖춘 발전 포트폴리오와 현장 전력 패키지","자체 대형엔진·터빈 생산능력 - 2030년까지 2024년 대비 대형엔진 2배, 가스터빈 2.5배로 확장 계획"],"text":"Caterpillar의 힘은 장비 자체보다 장비가 팔린 뒤에도 고객 곁에 남는 딜러망에서 나온다. 190개국 150곳 딜러가 정비·부품을 맡아 FY2025 부품·서비스 매출이 240억 달러에 이르렀고, 이 설치 기반이 다음 장비 구매로 이어진다. 여기에 소형 발전기부터 39MW급 가스터빈까지 한 회사에서 사서 1년 안에 전력을 낼 수 있다는 점이, 전력망을 기다리지 못하는 데이터센터 고객을 끌어들이는 새 해자가 됐다.","src":["s4","s3","s5","s11"]},"design":{"text":"이 딜러망을 통해 파는 제품은 세 개 기계·에너지 부문과 금융 부문으로 보고된다. Construction Industries는 굴착기·로더 같은 건설장비, Resource Industries는 광산 트럭·자율 운반 시스템(2026년부터 철도 포함), Power & Energy는 발전기용 왕복엔진, Solar Turbines 가스터빈, 가스 압축·산업용 엔진을 만든다. Financial Products(Cat Financial)는 이 장비를 사는 고객과 딜러에게 할부·리스를 제공한다.","src":["s1","s4","s5"]},"make":{"model":"in-house manufacturing","partners":["자체 공장 - 인디애나 Lafayette 대형엔진 공장에 7.25억 달러 증설 (2025-10 발표, 1982년 개장 이후 최대 투자)","Solar Turbines (자회사) - 산업용 가스터빈(Titan 130 등)과 발전 패키지(PGM130) 생산","부품·소재 공급망 - FY2026 증분 관세 비용 약 22억 달러 예상 (2026-08 기준)","Vertiv - 데이터센터용 전력분배·냉각 장비와 Cat 발전 설비를 묶은 사전 설계 아키텍처 협업 (2025-11 발표)"],"text":"설계한 제품은 대부분 자기 공장에서 직접 만든다. 데이터센터 주문이 몰리자 대형엔진을 만드는 Lafayette 공장에 7.25억 달러를 투입했고, 가스터빈은 자회사 Solar Turbines가 생산능력을 2024년의 2.5배로 늘리는 중이다. 부품은 외부 공급망에서 사들여 관세 비용(2026년 약 22억 달러 예상)을 떠안고, 냉각·전력분배는 Vertiv와 손잡아 데이터센터에 통째로 들어가는 패키지를 만든다.","src":["s13","s3","s6","s11"]},"sell":{"customers":["건설사·인프라 시공사 (Construction Industries, 2026년 2분기 매출 83.5억 달러)","광산사 (예: Vale 자율 운반 혼합 차량 90대 이상)","데이터센터 개발사 - AIP(Monarch 캠퍼스 2GW 가스발전기 주문), Joule(유타, G3520K), Hunt Energy(최대 1GW), Stella Power(Titan 130 터빈)","Chevron Project Kilby - Microsoft용 약 2.67GW 중 GE Vernova 몫을 제외한 나머지를 Solar Turbines가 공급","가스 압축·파이프라인 사업자, 산업 고객, 철도 사업자"],"channel":"독립 딜러(미국 41곳, 해외 109곳)를 통한 판매가 기본이다. 딜러가 재고를 들고 최종 고객에게 팔며, AIP 주문처럼 대형 데이터센터 거래도 Boyd CAT 같은 딜러가 함께 맺는다. Solar Turbines 터빈은 회사가 직접 계약하는 비중이 크다.","concentration":"최대 고객 비중 공시 확인 못함. 판매는 딜러망을 거친다.","text":"만든 장비는 대부분 독립 딜러가 재고로 들고 최종 고객에게 판다. 그래서 회사 매출은 '최종 판매 + 딜러 재고 증감'으로 정해지고, FY2025에는 딜러 재고가 5억 달러 줄어 매출을 눌렀다. 데이터센터 쪽에서는 AIP 2GW, Hunt 최대 1GW 같은 기가와트급 다년 주문이 들어와, 건설장비보다 훨씬 긴 일정의 수요가 쌓이고 있다.","src":["s4","s3","s14","s11","s12"]},"moneyFlow":{"steps":[{"from":"하이퍼스케일러·AI 기업 (Microsoft 등)","to":"데이터센터 개발사·발전 사업자 (AIP, Joule, Hunt, Chevron Kilby)","what":"전력 구매 계약·임대료"},{"from":"데이터센터 개발사·발전 사업자","to":"Cat 딜러(Boyd CAT 등)·Solar Turbines","what":"가스발전기 세트·가스터빈 구매 (기가와트 단위 다년 주문)"},{"from":"건설사·광산사","to":"독립 딜러","what":"장비 구매·임대"},{"from":"독립 딜러","to":"Caterpillar","what":"장비·엔진 대금 (딜러 재고 증감 반영, 대당 가격)"},{"from":"장비 소유자 (딜러 경유)","to":"Caterpillar","what":"부품·정비 서비스 대금 (FY2025 240억 달러)"},{"from":"고객·딜러","to":"Cat Financial","what":"할부·리스 이자 (FY2025 수익 36.1억 달러)"}],"pricing":"장비·엔진·터빈은 대당 가격으로 팔고, 해마다 가격 인상(price realization)으로 마진을 관리한다(FY2025 -8억 달러, 2026년 2분기 +5.95억 달러). 부품·서비스는 설치 기반에서 반복 발생하고, Cat Financial은 금리 스프레드로 번다.","text":"돈은 AI 기업이 데이터센터 전력을 사는 데서 시작해, 개발사가 발전기와 터빈을 사면서 딜러와 Caterpillar로 들어온다. 건설·광산 장비는 딜러를 거쳐 대당 가격으로 들어오고, 장비가 돌아가는 동안 부품·정비 대금이 계속 따라온다. 마지막으로 Cat Financial이 그 장비 구매를 할부·리스로 빌려주며 이자를 한 번 더 받는다.","src":["s1","s2","s3","s11","s12","s14"]},"earnings":{"period":"FY2025 (ended 2025-12-31)","revenue":{"value":67.6,"unit":"USD bn","yoy":4.3},"grossMargin":30.1,"operatingMargin":16.5,"netMargin":13.1,"operatingCashFlow":{"value":11.7,"unit":"USD bn"},"freeCashFlow":{"value":9.5,"unit":"USD bn"},"segments":[{"name":"Construction Industries (내부거래 포함 세그먼트 매출)","revenue":25.1,"unit":"USD bn","shar 17억 달러)의 가장 큰 쓰임은 자사주 매입 52억 달러였고, 배당 27억 달러와 합쳐 MP&E 잉여현금흐름(95억 달러)의 84%를 돌려줬다. 설비투자는 28억 달러, R&D는 21억 달러였고, 고객에게 빌려줄 임대 장비에도 15억 달러를 썼다. 2026년에는 설비투자를 약 35억 달러로 늘려 엔진·터빈 증설에 쓰면서, 주주환원과 데이터센터용 생산능력 확대를 함께 끌고 가는 방향이다.","src":["s2","s3","s6"]},"aiChain":{"layer":"power-energy","position":"AI 데이터센터의 현장 발전 설비 공급자. 전력망 연결이 늦어진 데이터센터에 주전원(prime power)용 가스 왕복엔진 발전기(G3516·G3520K 등)와 Solar Turbines 가스터빈(Titan 130 등)을, 기존 데이터센터에는 백업 발전기를 공급한다.","dependsOn":["부품·소재 공급망 (관세 노출)","천연가스 공급 (고객 측)","자체 대형엔진·터빈 생산능력 (Lafayette 증설 등)","Vertiv 등 전력분배·냉각 파트너"],"sellsTo":["data-center-real-estate (AIP, Joule, Hunt Energy 등 개발사)","power-energy (Chevron Kilby, Stella Power 등 발전 사업자)","cloud-infrastructure (Microsoft 등 하이퍼스케일러가 최종 수요자)"],"aiRevenue":"AI 매출을 따로 공시하지 않는다. 가장 가까운 지표는 Power Generation 매출 2026년 2분기 31.0억 달러(+29%)로 회사가 '주로 데이터센터 용도'라고 밝혔고, 2026-01 기준 1GW 이상 데이터센터 주전원 주문을 4건 보유했다.","upside":"하이퍼스케일러 설비투자가 전력 부족에 막힐수록 1년 안에 전력을 낼 수 있는 현장 가스발전 수요가 늘고, 다년 주문이 수주잔고(721억 달러)로 쌓인다. 설치 뒤 부품·정비 매출이 수십 년 따라붙는다.","risk":"데이터센터 투자가 식거나 전력망 연결이 빨라지면 현장 발전 수요가 줄 수 있다. 대형 주전원에서는 GE Vernova 같은 대형 터빈 업체가 다수 몫을 가져가고(Kilby 사례), 생산능력 증설이 늦으면 주문을 놓친다.","text":"그래서 AI 가치사슬에서 Caterpillar는 '전력·에너지' 층, 그중에서도 데이터센터 울타리 안의 발전기 자리에 있다. NVIDIA GPU가 아무리 많아도 전기가 없으면 돌지 않는데, 전력망 연결이 수년씩 밀리자 개발사들이 AIP 2GW처럼 기가와트 단위로 가스발전기를 직접 사기 시작했다. AI 매출이 따로 공시되진 않지만, Power Generation 매출이 2026년 1분기 41%, 2분기 29% 늘어난 것이 그 연결을 보여준다.","src":["s1","s3","s11","s12","s14"]},"competition":{"arenas":[{"arena":"데이터센터 발전기 (왕복엔진 백업·주전원)","rivals":["Cummins","Rolls-Royce (mtu)","Rehlko (옛 Kohler Energy)","Mitsubishi","Wärtsilä"],"position":"leader","share":"Caterpillar와 Cummins가 2023년 글로벌 데이터센터 발전기 시장에서 각각 10% 이상 (Global Market Insights 추정, 페이지 미열람)","src":["s15","s11"]},{"arena":"가스터빈 주전원 (대형 발전)","rivals":["GE Vernova","Siemens Energy","Mitsubishi Power"],"position":"niche","share":null,"src":["s12","s5"]},{"arena":"건설장비","rivals":["Komatsu","XCMG (KHL 2026 Yellow Table 3위, 점유율 5.8%)","SANY","Deere","Volvo CE"],"position":"leader","s g AI in 'very Costco way' (Q1 FY2026 call: AI pharmacy reordering, pre-scan checkout, gas AI tools)","url":"https://constellationr.com/insights/news/costco-approaching-ai-very-costco-way","publisher":"Constellation Research","date":"2025-12-15"},{"id":"s11","kind":"other","title":"Costco vs. Sam's Club in 2026: a comparative analysis of the U.S. warehouse club market (publication date not shown; accessed date)","url":"https://www.mmcginvest.com/post/costco-vs-sam-s-club-in-2026-a-comparative-analysis-of-the-u-s-warehouse-club-market","publisher":"MMCG Invest","date":"2026-10-28"},{"id":"s12","kind":"other","title":"Costco earnings calendar (Q1 FY2027 date inferred, not company-confirmed; accessed date)","url":"https://www.wallstreethorizon.com/costco-earnings-calendar","publisher":"Wall Street Horizon","date":"2026-10-28"}],"moat":{"sources":["회원비가 이익을 받쳐 주기 때문에 상품을 원가에 가깝게 팔 수 있는 구조 - FY2026 회원비 59.07억 달러, 영업이익 116.85억 달러","창고당 활성 SKU 4,000개 미만으로 품목 수를 줄여 품목당 매입 규모를 키우는 구매력","높은 충성도 - 미국·캐나다 갱신율 92.3%, 전 세계 89.8% (FY2026 말)","Kirkland Signature 자체 브랜드와 직접 매입·물류 거점(depot) 체계"],"text":"Costco의 힘은 '싸게 판다'가 아니라 '싸게 팔아도 되는 구조'에 있다. 회원비로 이익의 상당 부분을 미리 확보하므로 상품 마진을 얇게 유지할 수 있고, 품목을 4,000개 미만으로 줄여 한 품목을 아주 많이 사들이기 때문에 공급업체와의 협상력이 커진다. 이렇게 낮아진 가격이 다시 회원을 붙잡아 미국·캐나다 갱신율 92.3%라는 결과로 돌아온다.","src":["s1","s3"]},"design":{"text":"이 구조 위에서 Costco가 '설계'하는 것은 제품이 아니라 매장 구성과 회원권이다. 10-K는 상품을 Foods and Sundries, Non-Foods, Fresh Foods, 그리고 주유소·약국·안경·여행 같은 Warehouse Ancillary 사업으로 나누고, 회원권은 기본(Gold Star·Business)과 연 2% 리워드를 주는 Executive로 구분한다. 여기에 온라인 SKU 9,000~11,000개의 디지털 채널과 Kirkland Signature 자체 브랜드가 더해진다.","src":["s3","s9"]},"make":{"model":"mixed","partners":["글로벌 소비재·식품 제조사 - 대부분의 상품을 공급업체에서 직접 매입 (10-K)","Kirkland Signature 위탁 제조사 - 자체 브랜드 상품을 매입 또는 직접 제조 (업체명 미공개)","자체 가공·포장·제조 시설 - 10-K가 운영 사실만 밝히고 개수는 미기재","depot(물류 거점) - 공급업체 대량 화물을 받아 창고로 빠르게 재분배"],"text":"매장에 놓일 상품은 대부분 제조사에서 직접 사들이고, 중간 도매상을 거치지 않아 그만큼 원가를 낮춘다. 품질과 수요가 높은 품목은 Kirkland Signature로 직접 매입하거나 자체 시설에서 가공·제조하며, 대량 화물은 depot에서 받아 곧바로 창고로 나눠 보낸다. 그래서 Costco는 순수 유통사와 제조사 사이의 '혼합형'에 가깝다.","src":["s3"]},"sell":{"customers":["개인 회원 (Gold Star) - 미국 연회비 65달러","사업자 회원 (Business)","Executive 회원 4,230만 명 - 매출의 75.6% (Q4 FY2026)","유료 회원 합계 8,410만 명, 카드 소지자 1억 5,040만 명 (FY2026 말)"],"channel":"회원 전용 창고형 매장 939곳(미국·푸에르토리코 647, 캐나다 115, 멕시코 43, 일본 37, 영국 29, 한국 20 등)과 9개국 전자상거래. 디지털 연계 매출은 FY2026 순매출의 11%.","concentration":"단일 고객 의존 없음. 매출은 수천만 명의 개인·사업자 회원에게 분산.","text":"이렇게 확보한 상품은 회원에게만 팔린다. FY2026 말 유료 회원은 8,410만 명이고, 이 중 연회비를 더 내는 Executive 회원 4,230만 명이 매출의 75.6%를 만든다. 매장은 939곳으로 미국이 647곳이며, 디지털 연계 매출은 아직 순매출의 11% 수준이지만 FY2026에 약 21% 늘었다.","src":["s1","s2","s3"]},"moneyFlow":{"steps":[{"from":"회원 (개인·사업자)","to":"Costco","what":"연회비 선납 - 미국 기본 65달러, Executive 130달러 (2024-09 인상)"},{"from":"Costco","to":"회원 부채 계정","what":"선납 연회비를 1년에 걸쳐 나눠 매출 인식 (이연 회원비, FY2026 말 약 30억 달러)"},{"from":"회원","to":"Costco","what":"상품·휘발유·약품 구매 대금 (순매출 2,972억 달러, 총마진 약 11%)"},{"from":"Costco","to":"공급업체·Kirkland 위탁 제조사","what":"상품 매입 대금 (상품원가 2,643억 달러)"},{"from":"Costco","to":"Executive 회원","what":"구매액의 2% 리워드 (연 최대 1,250달러, 미지급 리워드 약 30억 달러)"}],"pricing":"두 갈래로 돈을 받는다. 상품은 원가에 낮은 마크업만 붙여 팔고(FY2026 순매출 대비 총마진 약 11.1%, 계산값), 이익의 핵심은 매년 미리 받는 회원비(FY2026 59.07억 달러, +11%)다. Executive는 기본 65달러에 업그레이드 65달러를 더해 130달러이고, 대신 구매액 2%를 연 최대 1,250달러까지 돌려준다.","text":"돈의 흐름은 연회비를 먼저 받고 상품을 나중에 파는 순서다. 회원이 낸 1년치 회비는 일단 부채(이연 회원비)로 잡혔다가 매달 나눠 매출이 되므로, 이 부분은 거의 비용 없이 이익으로 떨어진다. 상품 쪽은 2,972억 달러를 팔아 원가 2,643억 달러를 치르고 나면 약 330억 달러가 남는데, 이것으로 인건비·임대료 등 운영비를 대부분 메운다. 결국 상품은 회원을 붙잡는 수단이고, 회비가 이익의 엔진이다.","src":["s1","s3","s9"]},"earnings":{"period":"FY2026 (52 weeks ended 2026-08-30)","revenue":{"value":303.154,"unit":"USD bn","yoy":10.1},"grossMargin":11.1,"operatingMargin":3.9,"netMargin":3,"operatingCashFlow":{"value":15.825,"unit":"USD bn"},"freeCashFlow":{"value":9.39,"unit":"USD bn"},"segments":[{"name":"Foods and Sundries","revenue":116.788,"unit":"USD bn","share":38.5,"yoy":null,"operatingMargin":null,"src":["s3"]},{"name" sellsTo":[],"aiRevenue":null,"upside":"AI가 재고 품절·인건비를 줄이고 계산대 속도를 높이면, 얇은 마진 구조에서 몇 bp의 비용 절감도 이익에 크게 반영된다. 회사는 약국 재고 AI로 품절률을 낮춰 재고율이 98% 이상이 됐다고 밝혔다(2025-12 보도).","risk":"10-K는 AI 발전이 사이버보안 위협의 규모와 속도를 키운다고 위험 요인에 적었다. 회원 데이터 유출은 신뢰 기반 모델에 직접 타격이다.","text":"그렇다면 AI 붐은 Costco에 어떤 의미일까. 실적을 움직이는 것은 여전히 회원·트래픽·출점이고, AI는 약국 자동 발주나 계산 속도 같은 운영 효율을 조금씩 높이는 도구에 그친다. 그래서 AI 가치사슬에서는 'AI 사용자(ai-adopter)'로 보는 것이 맞고, AI 관련 매출은 공시되지 않는다.","src":["s10","s3"]},"competition":{"arenas":[{"arena":"미국 창고형 회원제 할인점","rivals":["Walmart Sam's Club","BJ's Wholesale Club"],"position":"leader","share":"점유율 공식 통계 없음. 참고로 FY2025 순매출 Costco 2,699억 달러 vs Sam's Club 902억 달러 (MMCG 정리, 2026)","src":["s3","s11"]},{"arena":"미국 종합·식료품 소매","rivals":["Walmart","Target","Kroger"],"position":"challenger","share":null,"src":["s3"]},{"arena":"온라인·배송","rivals":["Amazon","Walmart"],"position":"follower","share":"디지털 연계 매출은 Costco 순매출의 11% (FY2026)","src":["s3"]},{"arena":"주유·약국·안경 등 부대사업","rivals":["Sam's Club","BJ's (창고형 경쟁자의 같은 부대사업)"],"position":"challenger","share":null,"src":["s3","s4"]}],"edge":"회비가 받쳐 주는 최저가, 적은 SKU로 키운 품목당 구매력, 92%대 갱신율. 매장당 매출이 Sam's Club의 약 두 배라는 외부 정리도 있다.","threats":"Walmart·Amazon의 빠른 배송과 디지털 경쟁, Sam's Club의 스캔앤고 등 계산 편의성. 회원비 성장률이 2024-09 인상 효과 소멸로 둔화하는 흐름(보도)도 쟁점이다.","text":"이 자리를 두고 Costco는 네 곳에서 싸운다. 창고형 회원제에서는 Sam's Club·BJ's보다 규모와 매장당 매출이 크고, 종합 소매에서는 Walmart·Target·Kroger와 가격으로 맞선다. 약한 곳은 온라인으로, 디지털 매출이 아직 11%에 그쳐 Amazon·Walmart를 따라가는 위치다. Costco는 사전 스캔·스캔앤고 시험 같은 계산 편의성 개선으로 이 차이를 줄이려 한다.","src":["s3","s11","s10","s7"]},"strategy":{"goal":"매출·EPS 목표는 내지 않고, 매년 출점 수와 설비투자 계획만 밝힌다. FY2027 최대 33곳 출점(이전 5곳 포함), 설비투자 약 75억 달러.","roadmap":[{"when":"FY2027 (2026-09 ~ 2027-08)","what":"신규 창고 최대 33곳 (이전 5곳 포함), 연말 약 967곳 추정","src":["s3","s2"]},{"when":"FY2027","what":"설비투자 약 75억 달러 (변경 가능)","src":["s3"]},{"when":"2027-01","what":"40억 달러 자사주 매입 프로그램 만료 (잔여 11.15억 달러)","src":["s3"]},{"when":"진행 중","what":"사전 스캔·자동 결제대·Scan & Go 시험, 약국·주유 AI 도구 확대","src":["s10"]}],"vision":"기술을 위한 om/news/press-releases","publisher":"GE Vernova / SEC EDGAR","date":"2026-10-28"}],"moat":{"sources":["대형 가스터빈은 소수 업체 과점 시장이며 GE Vernova가 가장 큰 계약 물량을 보유 (2026-06-30 잔고+슬롯예약 116GW)","수십 년 쓰이는 설치 기반에서 나오는 서비스 매출 - FY2025 서비스 171.3억 달러, 매출의 약 45%","2030년 전후까지 찬 생산 슬롯이 주는 가격 결정력 - 2026 상반기 신규 가스 수주 가격이 2025년 4분기보다 높음","발전(가스·원전)과 송배전(변압기·스위치기어·HVDC)을 한 회사가 함께 공급"],"text":"GE Vernova의 힘은 전 세계에 몇 곳 없는 대형 가스터빈 제조사라는 데서 나온다. 터빈은 한 번 설치되면 수십 년 정비가 필요해 FY2025 매출의 약 45%가 서비스였고, 지금은 생산 슬롯이 2030년 전후까지 찬 덕에 신규 주문 가격까지 오르고 있다. 여기에 전기를 만드는 설비와 잇는 설비(변압기·스위치기어)를 함께 판다는 점이 세 번째 뿌리다.","src":["s1","s2","s3","s7"]},"design":{"text":"이 기반 위에서 회사가 설계·판매하는 것은 세 부문으로 보고된다. Power는 HA급 대형 가스터빈과 항공기 엔진형(aeroderivative) 소형 터빈, 증기·수력, BWRX-300 소형모듈원전(SMR)과 그 정비 서비스다. Electrification은 2026-02 100% 인수한 Prolec GE 변압기, 스위치기어, HVDC, 그리드 소프트웨어이며, 데이터센터용 솔리드스테이트 변압기도 개발 중이다. Wind는 육상·해상 풍력으로, 현재 적자 축소 단계다.","src":["s1","s2","s3"]},"make":{"model":"in-house manufacturing","partners":["자체 가스터빈 공장 - 연 생산 20GW(2026 Q3 목표) → 24GW(2028) → 30GW(2030)","주조·단조·블레이드 등 공급망 - 회사는 2030년 30GW에 필요한 공급망 상당 부분을 확보했다고 밝힘 (업체명 미공시)","Prolec GE 변압기 공장 (2026-02 인수 완료)","미국 생산 인력 2025~2026년 약 1,800명 신규 채용"],"text":"이 장비들은 회사 자체 공장에서 만들며, 지금 실적의 상한은 수요가 아니라 생산능력이다. 가스터빈 연간 생산을 2026년 3분기 20GW, 2028년 24GW, 2030년 30GW로 늘리는 계획이고, 증설 비용은 고객 선수금으로 상당 부분 충당한다고 회사가 말했다. 변압기는 Prolec GE 인수로 공장을 직접 확보했다.","src":["s3","s7","s1"]},"sell":{"customers":["전력회사·독립발전사업자·산업 고객 - 가스 계약 GW의 약 80%","데이터센터 사업자·하이퍼스케일러 - 가스 계약 GW의 약 20% (2026 Q1·Q2 콜)","Crusoe (AI 데이터센터 개발사) - LM2500XPRESS 29기, 약 1GW (2024-12 10기 + 2025-06 19기)","약 26개국 약 100개 가스 고객 (Q2 2026 콜)","송전망 운영자·데이터센터 (Electrification)"],"channel":"발전사업자·전력회사·데이터센터 개발사와 직접 장기 계약. 가스터빈은 먼저 생산 슬롯을 예약(SRA)하고 이후 정식 주문으로 전환한다.","concentration":"단일 고객 매출 비중은 확인하지 못했다. 가스 계약 GW 기준 약 80% 전통 고객, 약 20% 데이터센터.","text":"이렇게 만든 설비는 대부분 전력회사와 발전사업자에게 팔리고, 가스 계약 물량의 약 20%가 데이터센터 전력용이다. Crusoe처럼 AI 데이터센터 옆에 현장 발전소를 세우려는 고객은 소형 항공기 엔진형 터빈을 수십 기씩 사 간다. 전기를 잇는 쪽에서는 데이터센터 관련 Electrification 수주가 2026년 1분기 24억 ncial results announcement (2026-10-29, 10 a.m. ET)","url":"https://lilly.gcs-web.com/news-releases/news-release-details/lilly-confirms-date-and-conference-call-third-quarter-2026","publisher":"Eli Lilly","date":"2026-10-15"}],"moat":{"sources":["tirzepatide(GIP/GLP-1 이중 작용)의 효능과 특허 - FY2025 Mounjaro+Zepbound 365억 달러, 총마진 83.0%","주사제 → 경구제(Foundayo) → 3중 작용제(retatrutide)로 이어지는 비만 파이프라인","선제적 대규모 생산능력 투자 - 2020년 이후 미국 내 설비 약정 500억 달러 이상","연 133억 달러(FY2025) R&D 재투자 능력"],"text":"Lilly의 해자는 체중 감량 효과가 큰 tirzepatide라는 약 자체와, 그 약을 수요만큼 만들어낼 수 있는 공장에서 나온다. 비만약은 수요가 공급을 넘던 시장이라, 효능만큼이나 '실제로 공급할 수 있느냐'가 점유율을 갈랐다. 여기에 경구제와 차세대 3중 작용제가 뒤를 받쳐, 특허가 끝나기 전에 다음 세대로 넘어갈 길을 만들어 두었다.","src":["s1","s10","s8"]},"design":{"text":"이 해자 위에서 Lilly가 개발하는 것은 인체용 전문의약품이며, 회사는 단일 사업부로 보고한다. 중심은 당뇨·비만 인크레틴(Mounjaro·Zepbound 주사제, 경구 Foundayo)이고, 그 밖에 항암(Verzenio·Jaypirca), 면역(Ebglyss·Taltz·Omvoh), 신경과학(알츠하이머 Kisunla) 제품군이 있다. 개발 단계에서는 retatrutide가 비만·수면무호흡·무릎 골관절염 통증 데이터 패키지를 완료했다.","src":["s4","s8","s1"]},"make":{"model":"in-house manufacturing","partners":["자체 원료의약품(API) 공장 - 앨라배마 60억 달러, 버지니아 Goochland 약 50억 달러(보도) 등 신규 부지","자체 주사제·주사펜(디바이스) 공장 - 펜실베이니아 Lehigh Valley 35억 달러 이상, 2031년 가동 예정, retatrutide 생산","인디애나 Lebanon 기존 거점 - 2026년 45억 달러 추가, 인디애나 누적 약정 210억 달러 이상","유럽 경구제 공장 30억 달러","외부 위탁생산사 - 10-K 기준 이름 미확인"],"text":"Lilly는 약을 직접 만든다는 점에서 위탁생산 비중이 큰 브랜드 회사와 다르다. 인크레틴 수요를 따라가려고 2020년 이후 미국에만 500억 달러 이상의 설비 투자를 약정했고, 원료(API)는 앨라배마·버지니아, 주사펜은 펜실베이니아, 경구제는 유럽 공장에서 맡는 식으로 나눠 짓는다. 다만 새 공장은 가동까지 수년이 걸려, 펜실베이니아 부지는 2031년에야 돌아간다.","src":["s1","s8","s10"]},"sell":{"customers":["미국 3대 도매상 McKesson, Cencora, Cardinal Health - 각각 연결매출의 '상당 비율' (정확한 비율 미공개)","실질 지불자: 약국혜택관리사(PBM)·상업보험·메디케어 (2026년 메디케어 Part D 체중관리 적용)","현금결제 환자 - Foundayo 월 149~349달러","미국 외 시장 - 중국 국가보험목록(NRDL) 등재로 Mounjaro 물량 급증"],"channel":"도매상 → 약국·병원의 전통 유통과, 회사가 직접 환자에게 현금가로 파는 채널을 함께 쓴다. 약 90개국 판매.","concentration":"McKesson·Cencora·Cardinal Health 세 도매상이 각각 매출의 상당 부분이고 그 외 10% 넘는 고객 없음 (10-K). FY2025 미국 434.8억 달러(약 67%), 미국 외 217. stimates-and-expected-move/","publisher":"CME Lite Group","date":"2026-10-08"},{"id":"s14","kind":"ir-site","title":"Amazon will share its Q3 2026 earnings on October 29","url":"https://www.aboutamazon.com/md/news/company-news/amazon-earnings-q3-2026-report","publisher":"Amazon","date":"2026-10-15"}],"moat":{"sources":["기업 IT 표준에 묶인 고객 기반 - Microsoft 365·Windows·보안·개발도구(GitHub 사용자 2억 2,500만 명)를 한 계약으로 묶어 파는 번들","세계 2위 클라우드(Azure) 규모 - FY2026 Azure 매출 1,019억 달러, 2026년 2분기 시장 점유율 약 20%","OpenAI 지분 약 27%와 2032년까지의 모델·지식재산 사용권, 여기에 Anthropic·Mistral·xAI 모델까지 올린 Foundry 카탈로그","6,780억 달러의 계약 잔고(상업 RPO)로 미리 확보된 수요"],"text":"Microsoft의 힘은 기업이 이미 쓰고 있는 Office·Windows·보안·GitHub 위에 새 제품을 한 계약으로 얹어 팔 수 있다는 데서 나온다. 같은 기업 고객이 Azure 클라우드와 Copilot까지 사게 되면서, FY2026 Azure 매출은 1,019억 달러로 처음 1,000억 달러를 넘었다. 여기에 OpenAI 지분 약 27%와 2032년까지의 모델 사용권이 더해져, 최신 AI 모델을 자기 제품과 클라우드에 가장 먼저 넣을 수 있는 자리를 갖고 있다.","src":["s2","s4","s9","s10"]},"design":{"text":"이 고객 기반에 회사가 내놓는 제품은 FY2027부터 두 부문으로 보고된다. Agents and Infra에는 Azure 클라우드·AI 플랫폼(Foundry), Microsoft 365 상업 클라우드와 Copilot, GitHub, Dynamics 365·LinkedIn 같은 업무 앱, 서버 라이선스가 들어가고, Devices and Consumer에는 Windows·Surface, Xbox, 검색·광고(Bing)가 들어간다. 클라우드 안쪽에서는 자체 AI 추론 칩 Maia 200과 자체 MAI 모델도 직접 설계한다.","src":["s2","s4","s12"]},"make":{"model":"mixed","partners":["NVIDIA - Azure AI 데이터센터의 GPU 시스템 (Vera Rubin 랙 배치 계획)","AMD - Helios 랙 규모 GPU 인프라 배치 계획","TSMC - 자체 AI 추론 칩 Maia 200 생산 (3나노)","데이터센터 부지·전력·리스 사업자 - FY2027부터 일부 데이터센터 계약을 금융리스에서 운용리스로 전환","OpenAI - 모델과 지식재산을 공급받는 파트너 (2032년까지 사용권)","PC OEM - Windows가 설치된 PC를 만들어 판매"],"text":"소프트웨어는 직접 만들지만, 그 소프트웨어를 돌리는 데이터센터는 NVIDIA·AMD의 GPU와 TSMC가 생산하는 자체 칩 Maia 200을 섞어서 짓는다. 회사는 Maia 200이 기존 장비보다 달러당 성능이 약 30% 낫다고 밝혔고, Q4 FY2026에만 데이터센터 31곳·약 1GW를 추가해 2년 안에 전체 용량을 두 배로 늘리는 중이다. 건물과 전력은 상당 부분 리스로 확보하기 때문에, 설비투자 수치에는 리스 방식 변화가 함께 섞여 있다.","src":["s4","s12","s5"]},"sell":{"customers":["대기업·정부·중소기업 - Microsoft 365, Azure, Dynamics 365, 보안","AI 연구소 - OpenAI(Azure 2,500억 달러 구매 약정), Anthropic(Azure 300억 달러 구매 약정)","개발자 - GitHub(사용자 2억 2,500만 명), GitHub Copilot(5,000만 명), Foundry(고객 10만 곳)","PC OEM과 개인 소비자 - Windows, Xbox, Microsoft 365 개인용, Bing 광고주"],"channel":"대기업은 직접 영업과 다년 엔터프라이즈 계약, 중소기업은 리셀러·클라우드 솔루션 파트너, PC는 OEM 사전 설치, 소비자와 게임은 온라인 스토어로 판다.","concentration":"10% 이상 단일 고객 공시는 확인 못함. 다만 상업 RPO 6,780억 달러는 전년 대비 84% 늘었지만 OpenAI를 빼면 25% 증가에 그쳐, 미래 매출 잔고에서 OpenAI 비중이 크다.","text":"만든 제품은 주로 이미 거래 중인 기업에 다년 계약으로 팔리고, 이제 OpenAI·Anthropic 같은 AI 연구소가 가장 큰 새 구매자가 됐다. OpenAI는 Azure를 2,500억 달러어치 사겠다고 약정했고, Anthropic도 300억 달러 약정을 맺었다. 그래서 계약 잔고(RPO)는 84% 늘었지만 OpenAI를 빼면 25% 증가라, 한 고객에 쏠린 정도가 이 회사의 새 위험이 됐다.","src":["s1","s4","s9","s11"]},"moneyFlow":{"steps":[{"from":"기업 직원 (좌석)","to":"Microsoft","what":"Microsoft 365·Copilot 좌석당 월 구독료 (다년 계약)"},{"from":"기업·개발자·스타트업","to":"Microsoft (Azure)","what":"연산·저장·AI 모델 호출 사용량 과금, 일부는 약정 할인 계약"},{"from":"OpenAI·Anthropic","to":"Microsoft (Azure)","what":"AI 학습·추론 연산 용량 장기 구매 약정 (OpenAI 2,500억, Anthropic 300억 달러)"},{"from":"PC 구매자 → PC OEM","to":"Microsoft","what":"Windows 라이선스료 (PC 한 대당)"},{"from":"Microsoft","to":"NVIDIA·AMD·TSMC·데이터센터 리스 사업자","what":"GPU·자체 칩 생산·건물·전력 대금 (FY2026 유형자산 취득 1,159억 달러)"},{"from":"Microsoft","to":"OpenAI·Anthropic","what":"지분 투자 (OpenAI 약 27% 보유, Anthropic 최대 50억 달러 투자 약정)"}],"pricing":"Microsoft 365·Copilot은 좌석당 구독, Azure는 사용량 과금과 장기 용량 약정, GitHub Copilot은 2026-06부터 사용량 기반 과금으로 바뀐 뒤 매출이 전분기 대비 60% 넘게 늘었다. Windows는 PC당 라이선스, Bing은 광고 클릭 과금이다.","text":"돈은 크게 두 줄기로 들어온다. 기업 직원 수만큼 받는 좌석 구독료가 안정적인 바닥을 깔고, AI 연구소와 기업이 쓴 만큼 내는 Azure 사용료가 성장 속도를 만든다. 들어온 돈은 다시 NVIDIA·AMD GPU와 데이터센터로 나가고, 일부는 OpenAI·Anthropic 지분으로 들어가 그 회사들이 다시 Azure를 사는 순환 구조를 이룬다.","src":["s1","s4","s9","s11"]},"earnings":{"period":"FY2026 (ended 2026-06-30)","revenue":{"value":331.8,"unit":"USD bn","yoy":18},"grossMargin":67.9,"operatingMargin":46.8,"netMargin":40.3,"operatingCashFlow":{"value":182.9,"unit":"USD bn"},"freeCashFlow":{"value":67,"unit":"USD bn"},"segments":[{"name":"Productivity and Business Processes (FY26 보고 기준)","revenue":140,"unit":"U 온다. 하나는 경쟁자가 들어올 수 없는 플로리다 전력 독점 영업권(FPL)이고, 다른 하나는 미국에서 가장 큰 규모로 풍력·태양광·배터리를 개발해 온 NEER의 경험이다. 규모 덕분에 장비와 자금을 싸게 조달하고, 이것이 다시 낮은 전기요금과 장기 계약 경쟁력으로 이어진다.","src":["s1","s2","s3"]},"design":{"text":"그래서 회사가 '설계'하는 것은 제품이 아니라 발전소와 전력 공급 계약이다. FPL은 플로리다에서 발전·송배전을 운영하며 순발전용량 35,963MW(2025-12-31)를 갖고, 50MW 이상 대형 부하용 요금제를 2025 요율 합의로 도입했다. NEER은 풍력·태양광·배터리·원전·가스 발전소를 개발해 장기 전력구매계약(PPA)으로 팔고, 최근에는 데이터센터용 대형 부하 허브를 수수료 방식으로 개발한다.","src":["s2","s3"]},"make":{"model":"asset-owner","partners":["태양광 모듈·풍력 터빈·배터리 공급사 (업체명 미확인)","가스터빈 공급사 - Paducah 가스 최대 2GW, 텍사스·펜실베이니아 가스 최대 9.5GW 추진 (업체명 미확인)","변압기 - 회사는 2030년까지 건설 계획을 감당할 변압기 물량을 확보했다고 밝힘 (2026-07-24 콜)","미 에너지부(DOE) - Duane Arnold 원전 재가동 대출 최대 19억 달러","송전망 운영자(RTO/ISO) - 계통 연결 승인"],"text":"NextEra는 장비를 사서 발전소를 직접 짓고 소유·운영하는 자산 보유형 회사다. 그래서 GE Vernova의 가스터빈이나 변압기 같은 장비 공급망과 송전망 연결 승인이 건설 속도를 정하며, 회사는 2030년까지 필요한 변압기 물량은 확보했다고 말했다. 공장 대신 대규모 부채와 자본시장 조달이 '생산 설비' 역할을 한다.","src":["s2","s3","s8","s1"]},"sell":{"customers":["플로리다 소매 고객 약 1,200만 명 - FPL 매출 중 도매·산업 고객은 약 5% (2025)","Google - Duane Arnold 원전 재가동 PPA, 기가와트급 데이터센터 캠퍼스 공동 개발 합의 (2025-12)","Meta - 약 2.5GW 신규 재생에너지 계약, 13개 프로젝트 2026~2028 가동 (2025-12)","Exxon - 발전소 연계 1.2GW 데이터센터 캠퍼스 (2025-12 보도)","미 연방 허브 3곳 약 16.5GW (텍사스 2·펜실베이니아 1), Paducah 데이터센터 캠퍼스","전력회사·협동조합 등 PPA 상대방"],"channel":"FPL은 규제 요금으로 소매 고객에게 직접 판매하고, NEER은 전력회사·기업·하이퍼스케일러와 장기 PPA를 직접 맺는다. 허브는 개발·건설·운영 수수료를 받는다.","concentration":"FPL은 소매 고객 기반이라 분산돼 있다. NEER의 상대방별 매출 비중은 확인하지 못했다.","text":"이렇게 지은 전기는 두 갈래로 팔린다. FPL은 플로리다 가정·기업에 규제 요금으로 팔고, NEER은 전력회사와 하이퍼스케일러에 장기 계약으로 판다(용량의 약 95%가 계약 기반). 2025년 12월에는 Google과 데이터센터 캠퍼스 공동 개발, Meta와 약 2.5GW 재생에너지 계약을 한꺼번에 발표해 AI 고객이 직접 상대방으로 들어왔다.","src":["s2","s7","s1","s3"]},"moneyFlow":{"steps":[{"from":"플로리다 가정·기업 (약 1,200만 명)","to":"FPL","what":"규제당국이 승인한 전기요금 - 연료비는 전가, 투자비에 허용 수익률"},{"from":"대형 부하 고객 (데이터센터)","to":"FPL","what":"대형 부하 전용 요금 - 1GW당 약 20억 달러 투자가 요율 기반에 편입 (회사 발언)"},{"from":"하이퍼스케일러·전력회사 (Google·Meta 등)","to":"NEER","what":"장기 PPA - MWh당 계약 가격, 재계약 시 최근 실현가 st ranking; read from search summary only, page returned 403; accessed date)","url":"https://www.fierce-network.com/data-center/snapshot-whats-happening-data-center-infrastructure-market","publisher":"Fierce Network","date":"2026-10-28"},{"id":"s16","kind":"other","title":"SEC EDGAR Vertiv 8-K filing list (no Q3 2026 results 8-K listed at research time; accessed date)","url":"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001674101&type=8-K","publisher":"SEC EDGAR","date":"2026-10-28"}],"moat":{"sources":["전력(UPS·배전·스위치기어)과 열관리(공랭·칠러·액체냉각)를 한 회사가 함께 설계·공급하는 폭 - 10-K","약 130개국 서비스망과 설치 기반에서 나오는 정비·부품 매출 (FY2025 20.2억 달러)","NVIDIA GB300·800V DC 데이터센터 공동 설계 레퍼런스로 차세대 랙 사양을 먼저 맞추는 위치","선수금을 받는 대형 프로젝트 수주잔고 (2025-12-31 150억 달러)"],"text":"Vertiv의 힘은 데이터센터에서 '칩 바깥'을 맡는 전력과 냉각을 한 회사가 함께 묶어 공급한다는 데 있다. GPU 세대가 바뀔 때마다 랙 전력과 발열 사양이 달라지는데, NVIDIA 차세대 플랫폼과 함께 설계해 온 레퍼런스가 있어 새 사양에 먼저 맞춘다. 여기에 전 세계 설치 기반을 돌보는 서비스망이 반복 매출을 만들어 두 번째 뿌리가 된다.","src":["s2","s4","s1","s11"]},"design":{"text":"그래서 회사가 설계하는 제품은 전력과 열 두 갈래로 나뉜다. 전력 쪽은 UPS, AC·DC 전력관리, 저·중압 스위치기어, 에너지저장이며 800V DC 제품은 2026년 고객 검증, 2027년 배치, 2028년 데이터홀 단위 확대를 계획한다. 열 쪽은 공랭·칠러·열배출과 액체냉각 CDU·콜드플레이트이고, 여기에 랙·모듈형 통합 인프라, 모니터링 소프트웨어, 정비 서비스가 붙는다. 2026-10-27에는 UtilityInnovation Group(UIG)을 인수해 현장 발전·마이크로그리드 제어까지 넓혔다.","src":["s2","s12","s4","s11"]},"make":{"model":"in-house manufacturing","partners":["자체 공장 - 미주 대형 증설 5건 진행 중, 말레이시아 조호르 신규 공장 (2026-07-29 콜)","UIG 공장 - 노스캐롤라이나·뉴저지 (2026-10-27 인수 완료)","부품 공급사 - 10-K는 다수 공급사 분산 조달이라고만 쓰고 이름은 밝히지 않음"],"text":"NVIDIA와 달리 Vertiv는 이 장비들을 대부분 자기 공장에서 만든다. 수요가 생산을 앞서자 미주에서 대형 공장 증설 5건과 말레이시아 조호르 신규 공장을 동시에 진행하고 있고, 재고는 하반기 증산 준비로 2025년 말 14.6억에서 2026년 6월 말 25.2억 달러로 늘었다. 그만큼 Q2에는 복잡한 다단계 프로젝트와 공급망 혼잡으로 일부 매출이 하반기로 밀리는 등, 실적이 공장 실행 속도에 묶여 있다.","src":["s12","s11","s2","s3"]},"sell":{"customers":["하이퍼스케일러 (클라우드 대기업)","코로케이션 사업자 (데이터센터 임대)","네오클라우드 (AI 전용 클라우드)와 프런티어 AI 연구소 - 2026-10 콘퍼런스 발언","기업·통신망·산업 고객","회사 자료상 최종시장 매출의 약 85%가 데이터센터 (팩트시트 스니펫)"],"channel":"데이터센터 사업자와의 대형 프로젝트 계약이 중심이며, 선수금·마일스톤 방식으로 대금을 받는다. 시공사·리셀러 경유 비중은 공시에서 확인하지 못했다.","concentration":"10-K는 대형 고객이 고객 기반의 '상당 부분'이라고만 쓰고 비율·이름은 공시하지 않는다(확인 범위 내).","text":"이렇게 만든 장비는 대부분 데이터센터를 짓는 쪽에 팔리며, 회사 자료상 최종시장의 약 85%가 데이터센터다. 경영진은 하이퍼스케일러·코로케이션·기업·네오클라우드 모두에서 파이프라인이 가속하고 있다고 말했고, 2026-10에는 프런티어 AI 연구소도 수요처로 꼽았다. 고객 이름과 비중은 공시하지 않아, 실제 수요는 하이퍼스케일러 설비투자와 데이터센터 착공으로 간접 확인해야 한다.","src":["s8","s12","s14","s2"]},"moneyFlow":{"steps":[{"from":"AI 서비스 이용자·기업","to":"하이퍼스케일러·네오클라우드·AI 연구소","what":"AI 구독료·클라우드 이용료"},{"from":"하이퍼스케일러·코로케이션·네오클라우드","to":"데이터센터 건설 프로젝트","what":"MW 단위 데이터센터 착공 예산 (전력·냉각 '그레이 스페이스' 장비 포함)"},{"from":"데이터센터 사업자","to":"Vertiv","what":"전력·냉각 장비 프로젝트 대금 - 선수금·마일스톤 수금, 2026-06-30 이연매출 36.3억 달러"},{"from":"설치 기반 고객","to":"Vertiv","what":"예방정비·원격감시·부품 대금 (FY2025 서비스·부품 20.2억 달러)"},{"from":"Vertiv","to":"피인수 기업 (UIG 등)","what":"인수 대금 - UIG 선지급 약 14.5억 달러 + EBITDA 연동 최대 11.5억 달러"}],"pricing":"주로 장비 단위·프로젝트 단위 판매이며, 대형 프로젝트는 선수금과 마일스톤으로 나눠 받는다. 서비스는 설치 기반 정비 계약·부품 판매. 회사는 메가와트당 장비 단가가 오를 것이라고 말한다.","text":"돈은 AI 서비스 이용료가 클라우드의 데이터센터 착공 예산이 되고, 그 예산 가운데 전력·냉각 몫이 Vertiv의 프로젝트 대금으로 들어오는 구조다. 대형 프로젝트는 선수금을 먼저 받기 때문에 2026년 6월 말 이연매출이 36.3억 달러까지 쌓였고, 이것이 현금흐름을 매출보다 앞서게 만든다. 한 번 깔린 장비는 이후 정비·부품 매출을 계속 낳아, 매출의 약 20%가 이 반복 고리에서 나온다.","src":["s12","s1","s4","s11"]},"earnings":{"period":"FY2025 (ended 2025-12-31)","revenue":{"value":10.23,"unit":"USD bn","yoy":27.7},"grossMargin":36.3,"operatingMargin":17.9,"netMargin":13,"operatingCashFlow":{"value":2.11,"unit":"USD bn"},"freeCashFlow":{"value":1.89,"unit":"USD bn"},"segments":[{"name":"Americas","revenue":6.39,"unit":"USD bn","share":62.4,"yoy":41.9,"operatingMargin":null,"src":["s1"]},{"name":"Asia Pacific","revenue":2.02,"unit":"USD bn","share":19.7,"yoy":17.5,"operatingMargin":null,"src":["s1"]},{"name":"EMEA","revenue":1.82,"unit":"USD bn","share":17.8,"yoy":1.7,"operatingMargin":null,"src":["s1"]}],"industryMetric":[{"name":"수주잔고·북투빌 (Q4 2025)","value":"잔고 150억 달러(전년 대비 +109%), 북투빌 약 2.9배, 유기적 수주 전년 대비 약 +252% (2025-12-31)", )"],"aiRevenue":"AI 매출을 따로 공시하지 않음. 최종시장의 약 85%가 데이터센터(팩트시트 스니펫, 2025-12-31 기준), 수주잔고 150억 달러(2025-12-31).","upside":"회사는 데이터센터 전력 용량 신규 추가가 연 약 20GW에서 5년 뒤 약 35GW로 늘고, 데이터센터 관련 시장(약 500억 달러)이 연 18~20% 성장한다고 본다(2026-05 투자자 행사, 2차 보도). 랙 밀도가 높아질수록 메가와트당 장비 단가도 오른다.","risk":"클라우드 설비투자 삭감·착공 지연, 800V DC·액체냉각 표준 전환기에 경쟁사나 GPU 업체 레퍼런스 설계에 밀릴 위험, 하이퍼스케일러 자체 설계, 공장 실행 지연에 따른 매출 이연.","text":"그래서 AI 가치사슬에서 Vertiv는 칩·서버 바깥에서 전기와 열을 다루는 '냉각·전기 설비' 층에 있다. GPU가 한 세대 바뀔 때마다 랙 전력과 발열이 커지므로, NVIDIA 로드맵이 곧 Vertiv 제품 로드맵이 된다. 반대로 AI 매출을 따로 밝히지 않을 만큼 데이터센터 의존도가 높아, 클라우드가 착공을 늦추면 수주가 바로 흔들린다.","src":["s8","s1","s4","s11","s13"]},"competition":{"arenas":[{"arena":"데이터센터 물리 인프라 전체 (전력+냉각)","rivals":["Schneider Electric","Eaton","Legrand","Huawei"],"position":"challenger","share":"Dell'Oro 분석가 발언: Schneider 1위, Vertiv가 0.5%p 이내 2위, Eaton 3위, 3사 합계 절반 미만 - 2024년 활동 기준 보도, 원문 미열람(s15)","src":["s15","s2"]},{"arena":"열관리·액체냉각 (칠러·CDU·콜드플레이트)","rivals":["Schneider Electric","nVent","Delta Electronics","Stulz","Johnson Controls"],"position":"challenger","share":null,"src":["s2"]},{"arena":"UPS·배전·스위치기어","rivals":["Schneider Electric","Eaton","Legrand","Socomec"],"position":"challenger","share":null,"src":["s2"]},{"arena":"800V DC 랙 전력","rivals":["Eaton","Schneider Electric","Delta Electronics"],"position":"challenger","share":null,"src":["s12","s4"]},{"arena":"현장 발전·마이크로그리드 (UIG 인수로 진입)","rivals":["Schneider Electric","발전설비 업체 (GE Vernova·Caterpillar 등)"],"position":"niche","share":null,"src":["s11"]}],"edge":"전력과 냉각을 한꺼번에 설계·통합(SmartRun·OneCore 등 통합 배치)하고, NVIDIA 차세대 랙과 공동 설계한 레퍼런스, 글로벌 서비스망을 갖췄다. 조정 영업이익률이 FY2025 20.4%에서 Q2 2026 22.6%로 올라 가격 결정력을 시사한다.","threats":"Schneider·Eaton이 같은 고객을 두고 액체냉각·800V DC에 투자하고, 하이퍼스케일러가 자체 설계를 늘릴 수 있다. 표준이 바뀌는 시기에는 기존 설치 기반의 이점이 줄어든다.","text":"이 자리를 두고 경쟁하는 상대는 Schneider Electric과 Eaton이 중심이며, 10-K는 Legrand·Huawei를 대형, Delta·Stulz·Johnson Controls를 냉각 분야 경쟁사로 적는다. 외부 분석에서는 Schneider가 근소하게 1위, Vertiv가 2위로 거론되지만 원문 점유율 숫자는 확인하지 못했다. Vertiv는 전력·냉각을 묶은 통합 제품과 NVID      ['매출총이익률', pct(e.grossMargin)], ['영업이익률', pct(e.operatingMargin)],
     [e.freeCashFlow && e.freeCashFlow.value != null ? '잉여현금흐름' : '순이익률', e.freeCashFlow && e.freeCashFlow.value != null ? usd(e.freeCashFlow.value, e.freeCashFlow.unit) : pct(e.netMargin)]].forEach(function (r) {
      if (!r[1]) return; var t = el('div', 'kpi'); t.appendChild(el('div', 'v', r[1])); var l = el('div', 'l', r[0]);
      if (r[2] != null) { var y = el('span', r[2] >= 0 ? 'up' : 'down', '  전년 대비 ' + (r[2] > 0 ? '+' : '') + r[2] + '%'); l.appendChild(y); }

    var segs = (e.segments || []).filter(function (x) { return x.revenue != null && x.revenue > 0; });

      var max = Math.max.apply(null, segs.map(function (x) { return x.revenue; })), tot = segs.reduce(function (a, x) { return a + x.revenue; }, 0);
      var bars = el('div', 'bars');
      segs.forEach(function (x) {
        var row = el('div', 'bar'); row.appendChild(cites(el('div', null, x.name), x.src));

        var share = x.share != null ? x.share : x.revenue / tot * 100;

        if (x.yoy != null) v.appendChild(el('span', x.yoy >= 0 ? 'up' : 'down', ' ' + (x.yoy > 0 ? '+' : '') + x.yoy + '%'));

    if (has(e.industryMetric)) { var im = el('ul'); e.industryMetric.forEach(function (m) { var li = el('li', null, m.name + ': ' + m.value); cites(li, m.src); im.appendChild(li); }); s2.appendChild(col('이 업종이 평가받는 숫자', im, 'one-col')); }

    // 5. competition

    if (has(c.arenas)) {
      var tw = el('div', 'tablewrap'); var t = el('table'); var hr = el('tr'); ['시장', '위치', '경쟁자', '점유율'].forEach(function (h) { hr.appendChild(el('th', null, h)); });

      c.arenas.forEach(function (a) { var tr = el('tr'); tr.appendChild(el('td', null, a.arena)); var pc = el('td'); pc.appendChild(el('span', 'pos ' + (a.position || ''), POS[a.position] || a.position || '')); tr.appendChild(pc); tr.appendChild(el('td', null, (a.rivals || []).join(', '))); tr.appendChild(cites(el('td', null, a.share || '—'), a.src)); tb.appendChild(tr); });
      t.appendChild(tb); tw.appendChild(t); s5.appendChild(tw);

    var cp = el('div', 'pair');
    if (has(c.edge)) cp.appendChild(col('지금 이기는 이유', el('p', null, c.edge)));
    if (has(c.threats)) cp.appendChild(col('점유율을 뺏길 수 있는 길', el('p', null, c.threats)));
    s5.appendChild(cp); if (has(c.text)) s5.appendChild(para(c.text, c.src));
    d.appendChild(s5);

    // 6. strategy and guidance
    var st = p.strategy || {}, gd = p.guidance || {}; var s6 = step('next', '앞으로 무엇을 하나');
    if (has(st.goal)) s6.appendChild(para(st.goal, st.src));
    if (has(st.roadmap)) { var road = el('div', 'road'); st.roadmap.forEach(function (m) { var r = el('div', 'm'); r.appendChild(el('span', 'when', m.when)); r.appendChild(cites(el('span', null, m.what), m.src)); road.appendChild(r); }); s6.appendChild(road); }
    if (has(st.vision)) s6.appendChild(para(st.vision, null));
    if (has(gd.latest)) {
      var tw2 = el('div', 'tablewrap'); var t2 = el('table'); var h2 = el('tr'); ['기간', '항목', '회사가 밝힌 숫자', '발표일'].forEach(function (h) { h2.appendChild(el('th', null, h)); });
      var th2 = el('thead'); th2.appendChild(h2); t2.appendChild(th2); var b2 = el('tbody');
      gd.latest.forEach(function (x) { var tr = el('tr'); tr.appendChild(el('td', null, x.period)); tr.appendChild(el('td', null, x.metric)); tr.appendChild(cites(el('td', null, x.value), x.src)); tr.appendChild(el('td', null, x.givenOn || '')); b2.appendChild(tr); });
      t2.appendChild(b2); tw2.appendChild(t2); s6.appendChild(tw2);
    }
    if (has(gd.track)) s6.appendChild(para(gd.track, gd.src, 'small'));
    if (p.estimates && has(p.estimates.text)) s6.appendChild(para('시장 예상: ' + p.estimates.text, p.estimates.src, 'small'));
    d.appendChild(s6);

    // 7. watch
    var w = p.watch || {}; var s7 = step('watch', '이야기가 맞는지 확인하는 법');
    var wp = el('div', 'pair');
    if (has(w.confirms)) wp.appendChild(col('맞아가고 있다는 신호', list(w.confirms), 'ok'));
    if (has(w.breaks)) wp.appendChild(col('어긋나고 있다는 신호', list(w.breaks), 'bad'));
    s7.appendChild(wp);
    if (has(w.keyNumbers)) { var kn = el('ul'); w.keyNumbers.forEach(function (m) { var li = el('li'); li.appendChild(el('b', null, m.name)); li.appendChild(document.createTextNode(' · ' + m.why)); kn.appendChild(li); }); s7.appendChild(col('분기마다 볼 숫자', kn, 'one-col')); }
    d.appendChild(s7);

    // 8. trading
    var tr8 = p.trading || {}; var s8 = step('trade', '매매에 쓰는 법');
    if (has(tr8.calendar)) { var cal = el('div', 'cal'); tr8.calendar.forEach(function (x) { var r = el('div', 'ev'); r.appendChild(el('span', 'when', x.date)); r.appendChild(cites(el('span', null, x.event), x.src)); cal.appendChild(r); }); s8.appendChild(col('다가오는 일정', cal, 'one-col')); }
    if (has(tr8.reaction)) s8.appendChild(col('실적 발표 때 주가가 반응하는 것', el('p', 'txt', tr8.reaction), 'one-col'));
    if (has(tr8.conditions)) s8.appendChild(col('지켜볼 조건', list(tr8.conditions), 'one-col'));
