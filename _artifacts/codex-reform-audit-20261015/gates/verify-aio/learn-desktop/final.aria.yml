      - heading "산술평균 수익률과 실현 복리 수익률의 괴리" [level=2]
      - paragraph: 어느 펀드가 "지난 2년 평균 수익률 0%"라고 광고한다. 본전은 지켰다는 말처럼 들린다. 그런데 계좌를 열어 보면 100만 원이 75만 원이 되어 있다. 광고가 거짓말을 한 것은 아니다. 평균을 내는 방법이 하나가 아닐 뿐이다.
      - paragraph: 첫해 50% 오르고 이듬해 50% 떨어졌다고 하자. 두 숫자를 더해 둘로 나누면 0%다. 하지만 돈은 더해지지 않고 곱해진다. 100만 원은 150만 원이 됐다가, 그 150만 원의 절반을 잃고 75만 원이 된다.
      - paragraph: 잃은 50%는 불어난 금액 위에서, 번 50%는 작은 금액 위에서 계산됐다. 같은 크기의 오르내림이라도 하락이 더 큰 돈을 깎는다. 그래서 흔들림이 클수록 실제로 쌓이는 성장(기하평균)은 산술평균보다 낮아진다. 이 간격을 변동성 손실이라고 부른다.
      - paragraph: 성과를 비교할 때 연평균 복리 수익률과 최대 낙폭을 함께 보는 이유가 여기에 있다. 평균 하나로는 그 사이 계좌가 얼마나 흔들렸는지, 결국 얼마가 남았는지 알 수 없다.
      - heading "흐름으로 보면" [level=3]
      - list:
        - listitem: "100"
        - text: →
        - listitem: +50% → 150
        - text: →
        - listitem: −50% → 75
        - text: →
        - listitem: 산술평균 0% · 실제 −25%
      - heading "숫자로 따라가 보면" [level=3]
      - term: 전제
      - definition: 1년차 +50% · 2년차 −50%
      - term: 계산
      - definition: 산술평균 = (50 − 50) ÷ 2 = 0%
      - term
      - definition: 실제 = 1.5 × 0.5 = 0.75
      - term
      - definition: 기하평균 = √0.75 − 1 ≈ −13.4%/년
      - term: 결과
      - definition: 평균 0%라고 들어도 실제 자산은 25% 줄었습니다.
      - heading "자주 빗나가는 해석" [level=3]
      - paragraph: 흔들림이 작으면 두 평균은 거의 겹친다. 매년 10%와 12%를 번갈아 낸 계좌는 산술평균 11%, 실제 연평균 약 10.995%로 사실상 같다. 문제는 평균 자체가 아니라, 평균이 감춘 흔들림의 크기다.
      - group: 근거와 가정 보기
