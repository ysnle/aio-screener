    - paragraph: 3개월 상위는 정유 · 서버/HW · 엔터프라이즈 SaaS. 그중 서버/HW · 엔터프라이즈 SaaS · 금 광산은 1개월 순위가 3개월보다 크게 낮아 강세가 식는 중. 반대로 DC 전력/냉각/건설 · 전력장비/그리드는 1개월 순위가 3개월보다 크게 앞서 최근 강해지는 곳. 네트워킹/인터커넥트(최근 5거래일 -13.8%)는 1개월 순위는 올랐지만 최근 5거래일에 평소 1주 움직임의 2배를 넘게 밀려 강해지는 중으로 보지 않습니다. 상위 5개 중 2개는 구성 종목 대부분이 50일선 위입니다.
