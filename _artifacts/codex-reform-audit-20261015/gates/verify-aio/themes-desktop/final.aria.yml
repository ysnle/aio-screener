  - region "테마 시나리오 — 단계와 거시 영향":
    - heading "테마 시나리오 — 단계와 거시 영향" [level=2]
    - paragraph: 최근 1개월(9/15~10/14) 미국 테마는 강한 쪽 광통신/포토닉스(+4.8%, 5거래일 -13.8%), 필수소비재(+4.2%, 5거래일 +5.4%), 로보틱스/자동화(+3.8%) · 약한 쪽 유틸리티(-12.3%), 크립토/블록체인(-9.7%, 5거래일 -11.2%), 금융(-9.1%)입니다 — 성격별로 묶을 테마 수가 부족해(성격마다 5개 미만) 강약 이동으로 읽지 않습니다.
    - paragraph: 미국 10/14 · 한국 10/15 확정 종가 · 테마 46개 · 중심 시나리오 '신용 경색' 기준. 단계는 6개월(한국 3개월)·1개월 수익률을 같은 기간 지수(미국 S&P 500 · 한국 코스피)와 비교해 정하고(1개월 ±1.5%p, 6개월 ±3.7%p 안의 차이는 앞선 것으로 보지 않음), 최근 5거래일이 평소 1주 움직임의 2배를 넘게 반대로 움직이면 1개월 판정을 보류합니다. 바람은 테마 성격과 거시 시나리오가 강하게·약하게 만드는 영역의 겹침으로 정합니다. 확률 숫자·가격·종목 지시는 쓰지 않습니다. 레버리지·포지션 쏠림을 직접 재는 자료는 없어 가격 단서(1개월 낙폭·50일선 위 비율)로만 봅니다.
    - img "테마 46개의 긴 추세와 최근 1개월 움직임 지도": 주도 지속 추세 속 조정 반등 시도 약세 지속 긴 추세, 지수 대비 (미국 6개월 · 한국 3개월) → 1개월, 지수 대비 → 한국 에너지 한국 의료기기 한국 통신 한국 K-푸드 유틸리티 한국 K-콘텐츠 방산 한국 2차전지
    - text: "수혜 부담 혼재 영향 작음 원: 미국 · 네모: 한국 · 중심 시나리오 기준"
    - paragraph: 한국은 강한 쪽 에너지(+1.9%, 5거래일 -4.9%)·의료기기(+0.8%), 약한 쪽 원전(-32.0%)·건설(-29.1%)입니다. 가격 흐름 기준이며 자금 유출입 자료는 아닙니다.
    - paragraph: "거시 부담에도 주도하는 테마(6개월·1개월 지수 대비, 최근 5거래일 확인): 미국 소프트웨어/클라우드(5거래일 -0.1%), 한국 2차전지(5거래일 -9.9%), 한국 K-콘텐츠(5거래일 -1.8%) — 업종 고유 동력(실적·구조 수요)이 있는지 확인이 필요합니다."
    - paragraph: "거시 수혜에도 약세인 테마: 미국 헬스케어/제약, 미국 방산/항공우주, 미국 유틸리티 — 업종 고유의 문제가 있는지 먼저 봅니다."
    - group: 주도 지속 (긴 추세가 지수보다 앞서고 1개월도 뒤처지지 않음) · 5개
    - group: 추세 약화 확인 중 (긴 추세는 앞서나 50일선 위 비율·조건·최근 5거래일이 받쳐 주지 않음) · 20개
    - group: 추세 속 조정 (긴 추세는 앞서나 1개월은 뒤처짐) · 4개
    - group: 반등 시도 (긴 추세는 앞서지 못하나 1개월은 앞섬) · 3개
    - group: 약세 지속 (긴 추세도 1개월도 앞서지 못함) · 14개
    - paragraph: 세부 종목 선택은 테마 상세·차트·기업·스크리너에서 직접 합니다.
