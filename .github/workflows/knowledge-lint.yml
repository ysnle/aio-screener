name: Knowledge base lint

# Scheduled backstop for context catalog/current state, frontmatter/currentness, skills,
# agents, hooks and workflow wiring. Push/PR CI runs the same contracts; this schedule also
# catches time-based staleness when no commit occurs. Semantic/human certification remains
# outside deterministic lint and must stay explicitly unverified.

on:
  schedule:
    - cron: '13 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run deterministic knowledge lint
        run: |
          node scripts/generate-workspace-state.mjs --check
          node scripts/sync-agent-profiles.mjs --check
          node scripts/ci-skill-contract-check.mjs
          node scripts/ci-skill-eval-fixture-check.mjs
          node scripts/ci-workspace-contract-check.mjs
          node scripts/ci-knowledge-lint-check.mjs
