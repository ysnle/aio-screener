name: Live user journey

# The deployed site used the way a reader uses it: entity pages for many tickers, every main route, the AI panel with
# representative questions, and a portfolio built from scratch (scripts/live-user-journey.mjs). Review sessions cannot
# reach ysnle.github.io or the Workers from their sandbox, so this runner is where the live screens and AI answers are read.
# Manual: the reviewer dispatches it after a release and reads the printed sections (job log or the uploaded text).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers for the 종목·차트·재무 pages'
        required: false
        default: ''
      skip:
        description: 'Comma-separated parts to skip (routes, pages, chat, portfolio)'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - scripts/live-user-journey.mjs
      - .github/workflows/live-user-journey.yml

permissions:
  contents: read

concurrency:
  group: aio-live-user-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    name: Live user journey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up the browser gates
        uses: ./.github/actions/setup-browser-gates
      - name: Use the live site
        env:
          AIO_JOURNEY_TICKERS: ${{ inputs.tickers }}
          AIO_JOURNEY_SKIP: ${{ inputs.skip }}
        run: |
          if [ -z "$AIO_JOURNEY_TICKERS" ]; then unset AIO_JOURNEY_TICKERS; fi
          node scripts/live-user-journey.mjs
      - name: Upload what each screen said
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-user-journey-${{ github.run_attempt }}
          path: _artifacts/live-user-journey/
          if-no-files-found: ignore
          retention-days: 14
