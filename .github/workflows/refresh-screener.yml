name: Refresh screener and SEC fundamentals

on:
  schedule:
    # :23 is already taken every hour by data-watchdog.yml, and refresh-data.yml offsets its own
    # crons away from crowded minutes for exactly this reason. :53 keeps clear of :17/:47 (refresh-data)
    # and :23, and puts the 06:xx UTC run after the KR completed-session cutoff (15:45 KST = 06:45 UTC);
    # at :41 that run fell four minutes short and every KR row stayed on the previous session.
    - cron: '53 */6 * * *'
    # v57.54: one run right after the US close (daily: the SLO window derives runs/day only from daily crons) (16:00 ET = 20:00 UTC EDT / 21:00 UTC EST) so home breadth reaches
    # the new session in about an hour instead of waiting up to ~4h for the 00:53 slot.
    - cron: '53 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  refresh-screener:
    runs-on: ubuntu-latest
    # P1666: the producer job alone owns the shared refresh lock. Waiting for CI and Pages moved to the
    # converge job below, which used to hold this lock for 5-9 minutes and delay the next refresh slot.
    concurrency:
      group: refresh-data
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.dispatch.outputs.sha }}
    # Includes waiting for the dispatched CI run to produce its attestation.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Require SEC provisioning before the SEC lanes
        env:
          SEC_UA: ${{ vars.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          # fetch-sec-fundamentals.mjs writes an `operator_configuration_required` snapshot and
          # exits 0 when this variable is empty, so the lane went green while collecting nothing —
          # the silent deficiency the operator runbook calls out. refresh-data.yml already fails
          # closed on the same variable via requireSecUserAgent(); match that contract here so a
          # misconfigured repository cannot commit an empty SEC cycle as a success.
          if ! printf '%s' "$SEC_UA" | grep -Eq '[^[:space:]]@[^[:space:]]+\.[^[:space:]]+'; then
            echo "::error::operator_required: SEC_USER_AGENT must be a monitored contact address, e.g. \"AIO-Screener/1.0 (contact@example.com)\""
            exit 1
          fi

      - name: Restore the producer-only SEC ledger (P1757)
        # public-data/sec-fundamentals.json (~67 MB) is not on main: it lives on the orphan data-store branch as one
        # force-pushed commit. Chain: data-store branch -> last copy in main's history -> none (full rebuild below).
        id: sec-ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/sec-fundamentals-store.mjs restore --github-output
          if [ "$(grep -c '^source=none$' "$GITHUB_OUTPUT" || true)" != "0" ]; then
            echo "::warning::P1757 no SEC ledger copy was restorable (data-store branch and main history); this run rebuilds every eligible issuer"
          fi

      - name: Refresh bounded SEC companyfacts batch
        env:
          SEC_BATCH_LIMIT: 24
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          # P1757: only when no ledger copy survived; the producer refuses to start from nothing otherwise.
          SEC_FULL_REBUILD: ${{ steps.sec-ledger.outputs.source == 'none' && '1' || '' }}
        run: node scripts/fetch-sec-fundamentals.mjs

      - name: Refresh Korean listed-company fundamentals (OpenDART, weekly)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          # P1654: free FSS disclosure API. Without the operator key the script exits 0 and keeps the artifact;
          # annotate so the missing key is visible instead of silently freezing Korean fundamentals.
          if [ -z "${DART_API_KEY}" ]; then echo "::notice::DART_API_KEY is not set (owner decision 2026-10-14: not registered) — Korean fundamentals are not collected"; fi
          node scripts/fetch-dart-fundamentals.mjs

      - name: Refresh weekly earnings calendar (Finnhub free tier)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -euo pipefail
          # fetch-earnings-calendar.mjs preserves the previous file and exits 0 when the key is
          # absent, so an unset secret freezes the calendar without any red step or changed file.
          # Annotate instead of failing: the key is optional for the lane, but its absence must be
          # visible in the run log rather than inferred from a file that never moved.
          if [ -z "${FINNHUB_API_KEY:-}" ]; then
            echo "::warning::FINNHUB_API_KEY is not configured — the earnings calendar keeps its previous file for this cycle"
          fi
          node scripts/fetch-earnings-calendar.mjs
          # A09 (2026-10-12): the CFTC positioning producer was retired with its screen widget (owner request, P1628).

      - name: Refresh analyst consensus estimates (rotating batch, reference only)
        run: |
          set -euo pipefail
          # v57.54: next-four-quarter consensus EPS for the Forward PER (US listings). R262 self-throttle: at most
          # CONSENSUS_BATCH_LIMIT symbols per run, oldest rows first; a blocked source keeps every previous row.
          node scripts/fetch-consensus-estimates.mjs

      - name: Refresh S&P 500 member weights (sector map)
        run: |
          set -euo pipefail
          # 2026-10-13: ticker/sector/weight only from the IVV daily holdings file; the script keeps the
          # previous artifact and annotates a warning when the source is unreachable or reshaped.
          node scripts/fetch-sp500-weights.mjs

      - name: Refresh US exchange listing (Nasdaq Trader symbol directory, daily)
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          # v57.81: every Nasdaq/NYSE/NYSE American/NYSE Arca/Cboe BZX/IEX symbol for exact-match checks (portfolio entry,
          # ticker page) with the SEC CIK joined by symbol. A copy under 20h old is kept; a failed fetch or a list below
          # the floors (8000 rows, universe index members) keeps the previous file and annotates a warning.
          node scripts/build-us-listings.mjs
          node scripts/ci-us-listings-check.mjs

      - name: Build bounded SEC runtime projection
        run: |
          set -euo pipefail
          # P1757: a ledger below 90% of main's published records (lost and rebuilt short) must not shrink the projection.
          node scripts/sec-fundamentals-store.mjs guard
          node scripts/build-sec-runtime-projection.mjs
          node scripts/ci-sec-runtime-projection-check.mjs

      - name: Refresh screener independently
        env:
          SCREENER_ONLY: '1'
          SCREENER_ENRICH: '1'
        run: node scripts/fetch-data.mjs

      - name: Validate semantic artifact contract
        run: node scripts/validate-screener-artifact.mjs public-data/screener.json

      - name: Validate screener workbench contract and blocked promotion boundary
        run: |
          node scripts/ci-screener-workbench-contract.mjs
          node scripts/ci-page-data-timeline-contract-check.mjs
          node scripts/ci-candidate-archive-check.mjs # P1465

      # The screener refresh owns SEC fundamentals, factor rows and their
      # reconciliation only.  Market-survey/news freshness (notably AAII) is
      # produced by refresh-data; running its web-research/data-cycle gates
      # here made a valid screener refresh fail on an unrelated stale lane.
      - name: Validate screener-owned reconciliation artifacts
        run: |
          node scripts/build-reconciliation-status.mjs
          node scripts/build-operations-status.mjs
          node scripts/ci-reconciliation-contract-check.mjs
          node scripts/ci-source-registry-contract-check.mjs
           node scripts/ci-professional-data-gap-check.mjs
          node scripts/ci-static-data-contract-check.mjs
          node scripts/ci-operations-status-check.mjs
          node scripts/verify-refresh-candidate.mjs --record "$RUNNER_TEMP/aio-refresh-screener-candidate.json"

      - name: Fail-closed promotion candidate gate before push
        # Screener/SEC artifacts are validated before the bot commit. The
        # independent CI dispatch below remains pinned to that exact SHA.
        run: |
          set -euo pipefail
          git diff --check
          node scripts/verify-refresh-candidate.mjs --expect "$RUNNER_TEMP/aio-refresh-screener-candidate.json"

      - name: Commit only validated screener artifacts
        id: commit
        run: |
          set -euo pipefail
          git config user.name "aio-data-bot"
          git config user.email "actions@github.com"
          stage_if_exists() {
            if [ -e "$1" ]; then
              git add -- "$1"
            fi
          }
          # P1757: public-data/sec-fundamentals.json is gitignored and published to the data-store branch below.
          git add -- public-data/screener.json public-data/sec-fundamentals-summary.json public-data/sec-fundamentals-summary.manifest.json public-data/screener-validation-gate.json public-data/reconciliation-status.json public-data/operations-status.json public-data/history.json public-config.json architecture/public-readiness.json
          stage_if_exists public-data/earnings-calendar.json
          stage_if_exists public-data/sp500-weights.json # 2026-10-13: S&P 500 sector map weights
          stage_if_exists public-data/us-listings.json # v57.81: official US exchange listing (daily)
          stage_if_exists public-data/consensus-estimates.json # v57.54: Forward PER consensus (reference)
          stage_if_exists public-data/kr-fundamentals.json # P1654: OpenDART Korean fundamentals
          stage_if_exists public-data/backtest-history.json
          stage_if_exists public-data/breadth-contributors.json # P1416: breadth drilldown
          stage_if_exists public-data/sec-fiscal-history.json # P1436: 재무 공시 fiscal-year series
          stage_if_exists public-data/screener-candidate-archive.json # P1465: forward candidate record
          node scripts/verify-refresh-candidate.mjs --expect-staged "$RUNNER_TEMP/aio-refresh-screener-candidate.json"
          # GitHub warns at 50 MB and rejects a push containing a file over 100 MB. Fail before the commit,
          # naming the file. P1757: the ~67 MB SEC ledger is no longer staged, so no file is exempt.
          oversized=""
          while IFS= read -r -d '' staged; do
            [ -f "$staged" ] || continue
            bytes="$(stat -c %s -- "$staged")"
            if [ "$bytes" -gt 52428800 ]; then oversized="$oversized $staged($((bytes / 1048576))MB)"; fi
          done < <(git diff --staged --name-only -z --diff-filter=ACMR)
          if [ -n "$oversized" ]; then
            echo "::error::staged file(s) over the 50 MB publish limit:$oversized"
            exit 1
          fi
          # P1757: publish the ledger BEFORE main so main's projection manifest never names a digest the store never
          # held. One parentless commit, lease-protected force push; skipped when the branch already holds this blob.
          node scripts/sec-fundamentals-store.mjs publish
          if git diff --staged --quiet; then
            echo "No screener changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "data: refresh screener and SEC fundamentals ${ts}"
          node scripts/verify-refresh-candidate.mjs --expect-commit "$RUNNER_TEMP/aio-refresh-screener-candidate.json"
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after ${max_attempts} attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            node scripts/verify-refresh-candidate.mjs --expect-commit "$RUNNER_TEMP/aio-refresh-screener-candidate.json"
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact produced commit to CI
        if: steps.commit.outputs.changed == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref main -f release_sha="$final_sha" -f origin="refresh-screener"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Dispatched CI for exact screener refresh commit $final_sha"

  # v57.81: the extended universe — every Russell 2000 member and every Nasdaq-listed common stock outside the core —
  # is its own job after the core job. It commits only its own three files, so a failure or timeout here can never
  # block or roll back the core screener. It refreshes once per new US session (screener-extended-due.mjs); the other
  # cycles exit after the due check. Budget per due run: membership ~10 s; SEC batch <= 600 issuers x ~0.4 s ~ 4 min
  # (2 requests per issuer at the 150 ms pace, under SEC's 10 req/s); ~4,200 one-year Yahoo histories at concurrency 5
  # (~19 req/s measured on the core's 1,143 in ~60 s) ~ 4-7 min; validate/commit ~1 min. ~12 min expected, 40 min cap.
  refresh-screener-extended:
    needs: refresh-screener
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-screener-extended
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.dispatch.outputs.sha }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The core job has just pushed; read its screener.json (US session) and push on top of it.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Decide whether the extended shard is due
        id: due
        env:
          SCREENER_EXTENDED_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/screener-extended-due.mjs

      - name: Refresh extended membership (Russell 2000 holdings + Nasdaq symbol directory)
        if: steps.due.outputs.due == 'true'
        run: node scripts/fetch-extended-universe.mjs

      - name: Refresh bounded SEC companyfacts batch for the extended universe
        if: steps.due.outputs.due == 'true'
        env:
          SEC_LEDGER_SCOPE: extended
          SEC_EXTENDED_BATCH_LIMIT: 600
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          # The core job already fails closed on a missing contact; here the shard still ranks on price factors.
          if ! printf '%s' "$SEC_USER_AGENT" | grep -Eq '[^[:space:]]@[^[:space:]]+\.[^[:space:]]+'; then
            echo "::warning::SEC_USER_AGENT is not configured — the extended SEC ledger is not refreshed this cycle"
            exit 0
          fi
          node scripts/fetch-sec-fundamentals.mjs

      - name: Refresh extended screener shard
        if: steps.due.outputs.due == 'true'
        env:
          SCREENER_EXTENDED: '1'
          # The due step above already decided; the producer must not second-guess it.
          SCREENER_EXTENDED_FORCE: '1'
        run: node scripts/fetch-data.mjs

      - name: Validate extended shard contract
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          node scripts/validate-screener-extended.mjs public-data/screener-extended.json
          node scripts/ci-screener-extended-contract-check.mjs
          node scripts/ci-artifact-size-headroom-check.mjs

      - name: Commit only extended screener artifacts
        if: steps.due.outputs.due == 'true'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "aio-data-bot"
          git config user.email "actions@github.com"
          for extended_file in public-data/screener-extended.json public-data/screener-extended-universe.json public-data/sec-fundamentals-extended.json; do
            if [ -e "$extended_file" ]; then git add -- "$extended_file"; fi
          done
          if git diff --staged --quiet; then
            echo "No extended screener changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "data: refresh extended screener universe ${ts}"
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::git push failed after 5 attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact produced commit to CI
        if: steps.commit.outputs.changed == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref main -f release_sha="$final_sha" -f origin="refresh-screener"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Dispatched CI for exact extended screener commit $final_sha"

  # v57.81: deploys the extended commit on its own, so the core's converge never waits for the extended job.
  converge-extended:
    needs: refresh-screener-extended
    if: ${{ !cancelled() && needs.refresh-screener-extended.outputs.sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    concurrency:
      group: live-convergence
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Converge live deployment to the attested extended revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-live-convergence.mjs --await-sha "${{ needs.refresh-screener-extended.outputs.sha }}" --timeout-min 12

  converge:
    needs: refresh-screener
    # Runs even when the producer failed so a lost hand-over self-heals (R606).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The driver gives up waiting after 12 min (AWAITING_CI_ATTESTATION) and the next cycle's converge
    # finds the attested run and dispatches Pages (R606 self-heal), so a 30-minute hold bought nothing.
    timeout-minutes: 15
    # Reads main/runs/artifacts and dispatches ci.yml / pages-deploy.yml; it never writes the repository.
    permissions:
      contents: read
      actions: write
    concurrency:
      group: live-convergence
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Converge live deployment to the attested revision
        # R606: this run owns the SEC/screener revision, so it must also hand the
        # attested CI run id to the Pages deploy workflow. See refresh-data.yml for
        # the full GITHUB_TOKEN/workflow_run explanation.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ needs.refresh-screener.outputs.sha }}" ]; then
            node scripts/ensure-live-convergence.mjs --await-sha "${{ needs.refresh-screener.outputs.sha }}" --timeout-min 12
          else
            node scripts/ensure-live-convergence.mjs
          fi
