name: Refresh screener and SEC fundamentals

on:
  schedule:
    # :23 is already taken every hour by data-watchdog.yml, and refresh-data.yml offsets its own
    # crons away from crowded minutes for exactly this reason. :41 keeps the two apart.
    - cron: '41 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh-screener:
    runs-on: ubuntu-latest
    # Includes waiting for the dispatched CI run to produce its attestation.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Require SEC provisioning before the SEC lanes
        env:
          SEC_UA: ${{ vars.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          # fetch-sec-fundamentals.mjs writes an `operator_configuration_required` snapshot and
          # exits 0 when this variable is empty, so the lane went green while collecting nothing —
          # the silent deficiency the operator runbook calls out. refresh-data.yml already fails
          # closed on the same variable via requireSecUserAgent(); match that contract here so a
          # misconfigured repository cannot commit an empty SEC cycle as a success.
          if ! printf '%s' "$SEC_UA" | grep -Eq '[^[:space:]]@[^[:space:]]+\.[^[:space:]]+'; then
            echo "::error::operator_required: SEC_USER_AGENT must be a monitored contact address, e.g. \"AIO-Screener/1.0 (contact@example.com)\""
            exit 1
          fi

      - name: Refresh bounded SEC companyfacts batch
        env:
          SEC_BATCH_LIMIT: 24
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/fetch-sec-fundamentals.mjs

      - name: Refresh weekly earnings calendar (Finnhub free tier)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -euo pipefail
          # fetch-earnings-calendar.mjs preserves the previous file and exits 0 when the key is
          # absent, so an unset secret freezes the calendar without any red step or changed file.
          # Annotate instead of failing: the key is optional for the lane, but its absence must be
          # visible in the run log rather than inferred from a file that never moved.
          if [ -z "${FINNHUB_API_KEY:-}" ]; then
            echo "::warning::FINNHUB_API_KEY is not configured — the earnings calendar keeps its previous file for this cycle"
          fi
          node scripts/fetch-earnings-calendar.mjs

      - name: Build bounded SEC runtime projection
        run: |
          node scripts/build-sec-runtime-projection.mjs
          node scripts/ci-sec-runtime-projection-check.mjs

      - name: Refresh screener independently
        env:
          SCREENER_ONLY: '1'
          SCREENER_ENRICH: '1'
        run: node scripts/fetch-data.mjs

      - name: Validate semantic artifact contract
        run: node scripts/validate-screener-artifact.mjs public-data/screener.json

      - name: Validate screener workbench contract and blocked promotion boundary
        run: |
          node scripts/ci-screener-workbench-contract.mjs
          node scripts/ci-page-data-timeline-contract-check.mjs

      # The screener refresh owns SEC fundamentals, factor rows and their
      # reconciliation only.  Market-survey/news freshness (notably AAII) is
      # produced by refresh-data; running its web-research/data-cycle gates
      # here made a valid screener refresh fail on an unrelated stale lane.
      - name: Validate screener-owned reconciliation artifacts
        run: |
          node scripts/build-reconciliation-status.mjs
          node scripts/build-operations-status.mjs
          node scripts/ci-reconciliation-contract-check.mjs
          node scripts/ci-source-registry-contract-check.mjs
           node scripts/ci-professional-data-gap-check.mjs
           node scripts/ci-static-data-contract-check.mjs
          node scripts/ci-operations-status-check.mjs

      - name: Fail-closed promotion candidate gate before push
        # Screener/SEC artifacts are validated before the bot commit. The
        # independent CI dispatch below remains pinned to that exact SHA.
        run: |
          set -euo pipefail
          git diff --check
          node scripts/ci-sec-runtime-projection-check.mjs
          node scripts/validate-screener-artifact.mjs public-data/screener.json
          node scripts/ci-screener-workbench-contract.mjs

      - name: Commit only validated screener artifacts
        id: commit
        run: |
          set -euo pipefail
          git config user.name "aio-data-bot"
          git config user.email "actions@github.com"
          stage_if_exists() {
            if [ -e "$1" ]; then
              git add -- "$1"
            fi
          }
          git add -- public-data/screener.json public-data/sec-fundamentals.json public-data/sec-fundamentals-summary.json public-data/sec-fundamentals-summary.manifest.json public-data/screener-validation-gate.json public-data/reconciliation-status.json public-data/operations-status.json public-data/history.json public-config.json architecture/public-readiness.json
          stage_if_exists public-data/earnings-calendar.json
          stage_if_exists public-data/backtest-history.json
          if git diff --staged --quiet; then
            echo "No screener changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%dT%H:%MZ")
          git commit -m "data: refresh screener and SEC fundamentals ${ts}"
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after ${max_attempts} attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact produced commit to CI
        if: steps.commit.outputs.changed == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref main -f release_sha="$final_sha" -f origin="refresh-screener"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Dispatched CI for exact screener refresh commit $final_sha"

      - name: Converge live deployment to the attested revision
        # R606: this run owns the SEC/screener revision, so it must also hand the
        # attested CI run id to the Pages deploy workflow. See refresh-data.yml for
        # the full GITHUB_TOKEN/workflow_run explanation.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ steps.dispatch.outputs.sha }}" ]; then
            node scripts/ensure-live-convergence.mjs --await-sha "${{ steps.dispatch.outputs.sha }}"
          else
            node scripts/ensure-live-convergence.mjs
          fi
