name: Annual exchange calendar review reminder

on:
  schedule:
    - cron: '0 9 1 11 *'
  workflow_dispatch:
    inputs:
      review_year:
        description: 'Calendar year to review; blank defaults to the next UTC calendar year.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: annual-exchange-calendar-review
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      year: ${{ steps.build.outputs.year }}
      body_b64: ${{ steps.build.outputs.body_b64 }}
    env:
      REVIEW_YEAR: ${{ inputs.review_year || '' }}
    steps:
      - name: Checkout the scheduled or dispatched SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Build review-only calendar reminder
        id: build
        env:
          AIO_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          review_year="${REVIEW_YEAR:-$(node -p 'new Date().getUTCFullYear() + 1')}"
          body_file="$RUNNER_TEMP/exchange-calendar-review.md"
          node scripts/build-exchange-calendar-review.mjs --year "$review_year" > "$body_file"
          echo "year=$review_year" >> "$GITHUB_OUTPUT"
          echo "body_b64=$(base64 -w0 "$body_file")" >> "$GITHUB_OUTPUT"

  issue:
    needs: report
    if: github.ref == 'refs/heads/main'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create or update the annual review issue
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_YEAR: ${{ needs.report.outputs.year }}
          REVIEW_BODY_B64: ${{ needs.report.outputs.body_b64 }}
        run: |
          set -euo pipefail
          title="[AIO] Annual exchange calendar review: ${REVIEW_YEAR}"
          body_file="$RUNNER_TEMP/exchange-calendar-review.md"
          printf '%s' "$REVIEW_BODY_B64" | base64 --decode > "$body_file"
          marker="<!-- aio-exchange-calendar-review:${REVIEW_YEAR} -->"
          matches="$(gh issue list --state all --search 'in:body aio-exchange-calendar-review' --json number,title,state,body,createdAt --limit 100)"
          matches="$(jq --arg marker "$marker" '[.[] | select((.body // "") | contains($marker))]' <<< "$matches")"
          if [ "$(jq 'length' <<< "$matches")" -eq 0 ]; then
            title_matches="$(gh issue list --state all --search "in:title \"Annual exchange calendar review\" ${REVIEW_YEAR}" --json number,title,state,body,createdAt --limit 100)"
            matches="$(jq --arg title "$title" '[.[] | select(.title == $title)]' <<< "$title_matches")"
          fi

          open_issue="$(jq -r '[.[] | select(.state == "OPEN")] | sort_by(.createdAt) | last | .number // empty' <<< "$matches")"
          closed_issue="$(jq -r '[.[] | select(.state == "CLOSED")] | sort_by(.createdAt) | last | .number // empty' <<< "$matches")"

          if [ -n "$open_issue" ]; then
            gh issue edit "$open_issue" --title "$title" --body-file "$body_file"
            echo "Updated annual exchange calendar review issue #${open_issue}"
          elif [ -n "$closed_issue" ]; then
            echo "Annual exchange calendar review issue #${closed_issue} is closed; leaving it closed."
          else
            gh issue create --title "$title" --body-file "$body_file"
            echo "Created annual exchange calendar review issue for ${REVIEW_YEAR}"
          fi
