name: Operations failure escalation

# One durable issue per monitored workflow. This turns repeated red runs into an owned,
# deduplicated recovery loop without editing source, dispatching work, or deploying.
on:
  workflow_run:
    workflows: ['CI', 'Deploy GitHub Pages', 'Data freshness watchdog', 'Knowledge base lint', 'Refresh market data', 'Refresh screener and SEC fundamentals', 'Deploy AI proxy', 'Deploy fast data plane']
    types: [completed]

permissions:
  actions: read
  issues: write

# This job mutates GitHub Issues (create/update/comment) and fires on every monitored
# workflow_run completion. Without a group, two completions close together can start two
# reconcile runs that race on the same marker issue. Serialize them; never cancel, because
# the second run carries the newer conclusion.
concurrency:
  group: aio-operations-alert
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reconcile workflow failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflow = run.name;
            const marker = `<!-- aio-operations-alert:${workflow} -->`;
            const label = 'aio-operations-alert';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'B60205', description: 'Automated AIO workflow recovery alert' });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              labels: label,
              per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && String(issue.body || '').includes(marker));
            const succeeded = run.conclusion === 'success';
            const runUrl = run.html_url;
            const sha = String(run.head_sha || '').slice(0, 12);
            const timestamp = new Date(run.updated_at || Date.now()).toISOString();
            let failedJobs = [];
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, per_page: 100
              });
              failedJobs = jobs
                .filter((job) => job.conclusion && job.conclusion !== 'success' && job.conclusion !== 'skipped')
                .map((job) => ({
                  name: job.name,
                  conclusion: job.conclusion,
                  steps: (job.steps || [])
                    .filter((step) => step.conclusion && step.conclusion !== 'success' && step.conclusion !== 'skipped')
                    .map((step) => step.name)
                }))
                .sort((left, right) => left.name.localeCompare(right.name));
            } catch (error) {
              failedJobs = [{ name: 'job-observation-unavailable', conclusion: `api:${error.status || 'error'}`, steps: [] }];
            }
            const failedGateSummary = failedJobs.length
              ? failedJobs.map((job) => `${job.name}${job.steps.length ? ` [${job.steps.join(', ')}]` : ''}`).join('; ')
              : 'no failed job detail reported by Actions API';
            const failureSignature = Buffer.from(JSON.stringify({ conclusion: run.conclusion || 'unknown', failedJobs }), 'utf8').toString('base64url').slice(0, 96);

            if (succeeded) {
              if (existing && existing.state === 'open') {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Recovered: [${workflow} run ${run.id}](${runUrl}) succeeded at ${timestamp}.` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }

            const recentRuns = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              branch: 'main',
              status: 'completed',
              per_page: 100
            });
            const sameWorkflowRuns = recentRuns
              .filter((candidate) => candidate.name === workflow && candidate.id !== run.id)
              .sort((left, right) => new Date(right.updated_at) - new Date(left.updated_at));
            let consecutiveFailures = 1;
            for (const candidate of sameWorkflowRuns) {
              if (candidate.conclusion === 'success') break;
              consecutiveFailures += 1;
            }
            if (consecutiveFailures < 2) return;

            const title = `[Operations] ${workflow} is ${run.conclusion || 'not successful'}`;
            const body = `${marker}\n<!-- aio-operations-alert-signature:${failureSignature} -->\n## Automated recovery alert\n\n- Workflow: **${workflow}**\n- Conclusion: **${run.conclusion || 'unknown'}**\n- Consecutive failures: **${consecutiveFailures}**\n- Branch: \`${run.head_branch || 'unknown'}\`\n- Revision: \`${sha || 'unknown'}\`\n- Updated: ${timestamp}\n- Run: ${runUrl}\n- Failed jobs/gates: ${failedGateSummary}\n- Failure signature: \`${failureSignature}\`\n\nThis issue is updated/reopened on repeated failures and closes only when the same workflow succeeds. Repeated identical failures update this body without adding a notification comment. It does not authorize an automatic source change, commit, dispatch, or deployment.`;
            if (existing) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: existing.number, per_page: 100
              });
              // The current body is itself durable state. Include it in the
              // comparison so a newly-created issue does not emit a delayed
              // duplicate comment on the next identical run merely because
              // the first run had no comment yet.
              const signatureMarker = `aio-operations-alert-signature:${failureSignature}`;
              const sameSignatureSeen = String(existing.body || '').includes(signatureMarker)
                || comments.some((comment) => String(comment.body || '').includes(signatureMarker));
              const reopened = existing.state !== 'open';
              const escalation = consecutiveFailures === 2;
              const signatureChanged = !sameSignatureSeen;
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body, state: 'open' });
              if (reopened || escalation || signatureChanged) {
                const reason = reopened ? 'reopened' : escalation ? 'escalation-threshold' : 'failure-signature-changed';
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `<!-- aio-operations-alert-signature:${failureSignature} -->\nOperations alert **${reason}**: [run ${run.id}](${runUrl}) concluded **${run.conclusion || 'unknown'}** at ${timestamp}. Failed jobs/gates: ${failedGateSummary}.` });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
