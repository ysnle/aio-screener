name: Event briefs (FOMC and market-mover earnings)

# v59.42 (owner audit 2026-10-28): scripts/fetch-event-briefs.mjs writes public-data/event-briefs.json from the Fed
# statement, the SEC 8-K/6-K Ex.99 of the mover list and the DART 공정공시, summarised by the shared Worker AI. A run
# without a new source document or a pending call summary makes no AI request and no commit. The data-plane Worker
# dispatches it at :05/:25/:45 (v59.81); the :07/:27/:47 cron below is only the fallback and stands down when that
# dispatch is live or succeeded (v59.85, scripts/cron-fallback-guard.mjs).
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: "set by the run itself on a push collision (collision); empty otherwise"
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: event-briefs
  cancel-in-progress: false

jobs:
  briefs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # v59.85: the :07/:27/:47 cron is the fallback for the Worker's :05/:25/:45 dispatch (v59.81); it stands down when
      # a run started inside 15 minutes is live or succeeded, so one slot is never two AI-eligible cycles. Fails open.
      - name: Stand down a cron slot the Worker dispatch already covers
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cron-fallback-guard.mjs --workflow event-briefs.yml --window-min 15 --github-output

      # Once per KRX session after 16:10 KST (the script exits early otherwise); a failure keeps the previous file.
      - name: Refresh KOSPI/KOSDAQ weight proxies
        if: steps.guard.outputs.covered != 'true'
        continue-on-error: true
        run: node scripts/fetch-kr-index-weights.mjs

      - name: Build event briefs
        if: steps.guard.outputs.covered != 'true'
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          AI_PROXY_URL: ${{ vars.AIO_PROXY_URL || 'https://aio-proxy.zmfhd007.workers.dev' }}
          AIO_AUTOMATION_TOKEN: ${{ secrets.AIO_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/fetch-event-briefs.mjs

      - name: Commit and dispatch CI
        if: steps.guard.outputs.covered != 'true'
        id: commit
        # v59.85: the shared publisher (set event-briefs). A file whose only change is generatedAt goes back to HEAD in the
        # index and the worktree (event-briefs.json since v59.62, kr-index-weights.json now), so a re-check makes no commit
        # and a push retry's rebase is never refused over a leftover modified file (run 42480198913 lost its briefs so).
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_RETRY: ${{ inputs.retry }}
        run: node scripts/publish-data-commit.mjs --set event-briefs --retry "${DISPATCH_RETRY:-}"
