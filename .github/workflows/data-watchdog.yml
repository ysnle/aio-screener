name: Data freshness watchdog

# Independent operating check. Local artifacts, Pages, proxy, fast plane and live
# invariants share one aggregate profile, so one red plane never hides the others.
on:
  # P1666: GitHub ran the hourly schedule 11 times in 3 days (2026-10-10~12), so the watchdog also follows
  # each Pages deployment — the moment live data changes. The schedule stays as the backstop for a stalled
  # pipeline that deploys nothing.
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: 'Maximum live artifact age in minutes.'
        required: false
        default: '360'

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: aio-data-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Bounded so a hung gate cannot occupy a runner for the 360-minute default.
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check every local and external plane without fail-fast hiding
        id: qa
        continue-on-error: true
        env:
          AIO_LIVE_MAX_AGE_MIN: ${{ github.event.inputs.max_age_minutes || '360' }}
          LIVE_HEADER_POLICY: operator-required
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: |
          set -o pipefail
          node scripts/qa-runner.mjs watchdog --no-cache --jobs 2 2>&1 | tee "$RUNNER_TEMP/watchdog-qa.log"

      - name: Summarize failed watchdog gates
        # P1083: this used to inline a JS template literal into `node -e "..."`,
        # which bash expanded first — every run died with `bad substitution` and
        # published an empty Step Summary, hiding which gate was red. The logic
        # now lives in a file that is unit-testable and shell-expansion free.
        if: always() && steps.qa.outcome != 'success'
        env:
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: node scripts/report-qa-failures.mjs --title Watchdog

      - name: Preserve operational health including nonblocking degradation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-operational-health-${{ github.run_id }}
          path: .cache/aio-qa/external-pipeline-status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build rolling 7/30-day operations evidence
        if: always()
        run: node scripts/build-operations-slo-window.mjs --out "$RUNNER_TEMP/operations-slo-window.json"

      - name: Upload rolling operations evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-operations-slo-window-${{ github.run_id }}
          path: ${{ runner.temp }}/operations-slo-window.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve watchdog failure conclusion
        if: always() && steps.qa.outcome != 'success'
        run: exit 1

  # P1736: a hand-kept reference value past its window (policy rate, KR CPI, schedule row, holiday table, web snapshot)
  # is held on screen as 기한 지남; this job keeps exactly one open issue listing them and closes it once none remain.
  # It never fails the watchdog for an expiry (only the qa job above judges health).
  manual-reference-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Evaluate the manual reference expiry registry
        id: expiry
        run: node scripts/ci-manual-reference-expiry-check.mjs --issue-body "$RUNNER_TEMP/manual-reference-expiry.md" --github-output
      - name: Open, update or close the expiry issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRED: ${{ steps.expiry.outputs.expired }}
          DIGEST: ${{ steps.expiry.outputs.digest }}
        run: |
          set -euo pipefail
          title="[AIO] Manual reference values past their window"
          body_file="$RUNNER_TEMP/manual-reference-expiry.md"
          # P1736: list open issues directly (no search index: an unindexed HTML-comment marker would open a duplicate
          # every run); match the body marker, then fall back to the exact title.
          open_issues="$(gh issue list --state open --limit 200 --json number,title,body,createdAt)"
          open_issue="$(jq -r '[.[] | select((.body // "") | contains("<!-- aio-manual-reference-expiry -->"))] | sort_by(.createdAt) | last | .number // empty' <<< "$open_issues")"
          if [ -z "$open_issue" ]; then
            open_issue="$(jq -r --arg title "$title" '[.[] | select(.title == $title)] | sort_by(.createdAt) | last | .number // empty' <<< "$open_issues")"
          fi
          if [ "$EXPIRED" = "true" ]; then
            if [ -n "$open_issue" ]; then
              current_body="$(gh issue view "$open_issue" --json body --jq .body)"
              if printf '%s' "$current_body" | grep -qF "aio-manual-reference-expiry-digest:${DIGEST} "; then
                echo "Expiry issue #${open_issue} already lists ${DIGEST}"
              else
                gh issue edit "$open_issue" --title "$title" --body-file "$body_file"
                echo "Updated expiry issue #${open_issue}"
              fi
            else
              gh issue create --title "$title" --body-file "$body_file"
              echo "Created expiry issue"
            fi
          elif [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "No manual reference value is past its window any more (watchdog run ${GITHUB_RUN_ID})."
            echo "Closed expiry issue #${open_issue}"
          else
            echo "No expired manual reference."
          fi
