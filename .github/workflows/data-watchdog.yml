name: Data freshness watchdog

# Independent operating check. Local artifacts, Pages, proxy, fast plane and live
# invariants share one aggregate profile, so one red plane never hides the others.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: 'Maximum live artifact age in minutes.'
        required: false
        default: '360'

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: aio-data-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check every local and external plane without fail-fast hiding
        id: qa
        continue-on-error: true
        env:
          AIO_LIVE_MAX_AGE_MIN: ${{ github.event.inputs.max_age_minutes || '360' }}
          LIVE_HEADER_POLICY: operator-required
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: |
          set -o pipefail
          node scripts/qa-runner.mjs watchdog --no-cache --jobs 2 2>&1 | tee "$RUNNER_TEMP/watchdog-qa.log"

      - name: Summarize failed watchdog gates
        if: always() && steps.qa.outcome != 'success'
        env:
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const reportPath=process.env.AIO_QA_CACHE_DIR + '/last-run.json'; let report=null; try { report=JSON.parse(fs.readFileSync(reportPath,'utf8')); } catch (error) { report={error:'qa report unavailable: '+error.message}; } const failed=(report.results||[]).filter((entry)=>entry.status==='FAIL'); const skipped=(report.results||[]).filter((entry)=>entry.status==='SKIP'); const lines=['## Watchdog failure detail','',`- Failed gates: ${failed.map((entry)=>entry.id).join(', ') || 'unavailable'}`,`- Failed gate details: ${failed.map((entry)=>entry.id+': '+(entry.error||entry.output||'no detail').split('\\n').slice(-3).join(' | ')).join(' ; ') || 'unavailable'}`,`- Blocked/skipped gates: ${skipped.map((entry)=>entry.id).join(', ') || 'none'}`,`- QA report: ${reportPath}`,'']; fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\\n')+'\\n'); console.log(lines.join('\\n'));"

      - name: Build rolling 7/30-day operations evidence
        if: always()
        run: node scripts/build-operations-slo-window.mjs --out "$RUNNER_TEMP/operations-slo-window.json"

      - name: Upload rolling operations evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aio-operations-slo-window-${{ github.run_id }}
          path: ${{ runner.temp }}/operations-slo-window.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve watchdog failure conclusion
        if: always() && steps.qa.outcome != 'success'
        run: exit 1
