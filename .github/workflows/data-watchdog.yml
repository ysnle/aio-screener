name: Data freshness watchdog

# Independent watchdog for committed public-data artifacts. It does not fetch
# network data; it fails loudly when scheduled refresh commits stop arriving.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: 'Maximum allowed age in minutes before failing.'
        required: false
        default: '180'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check public-data freshness
        env:
          MAX_AGE_MIN: ${{ github.event.inputs.max_age_minutes || '180' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const max = parseInt(process.env.MAX_AGE_MIN || '180', 10);

          function readJson(path) {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (e) {
              console.error(`${path} read/parse failed: ${e.message}`);
              process.exit(1);
            }
          }

          function checkAge(label, ts) {
            if (!ts) {
              console.error(`${label} timestamp missing`);
              process.exit(1);
            }
            const ageMin = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
            console.log(`${label}=${ts} / age=${ageMin}min / max=${max}min`);
            if (!Number.isFinite(ageMin) || ageMin > max) {
              console.error(`${label} is stale (${ageMin}min > ${max}min). Check refresh-data.yml schedule and commit permissions.`);
              process.exit(1);
            }
            return ageMin;
          }

          const data = readJson('public-data/data.json');
          checkAge('data.json meta.generatedAt', data && data.meta && data.meta.generatedAt);
          console.log(`symbolsOk=${data.meta && data.meta.symbolsOk} fearGreedOk=${data.meta && data.meta.fearGreedOk} fredOk=${data.meta && data.meta.fredOk}`);

          const tg = readJson('public-data/telegram-digest.json');
          checkAge('telegram-digest.json generatedAt', tg && tg.generatedAt);
          console.log(`telegramCount=${tg.count} channels=${Array.isArray(tg.channels) ? tg.channels.length : 0}`);

          console.log('public-data freshness OK');
          NODE
