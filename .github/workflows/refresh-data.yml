name: Refresh market data

# 왜: 브라우저 대신 GitHub 서버가 데이터를 받아 public-data/data.json으로 떨군다.
# CORS/프록시/키노출 없이 항상 신선. 정적 사이트는 같은 출처 data.json만 읽는다.
# 사용자가 손댈 일 없음 — 이 워크플로가 알아서 돈다.

on:
  schedule:
    # v50.24/WO-1: 정시(:00)는 GitHub Actions가 가장 혼잡해 schedule 런이 자주 드롭/지연된다.
    # 정시를 피해 :17, :47에 실행(30분 간격 유지) → 발화 신뢰도 향상.
    # 주의: GitHub 무료 schedule은 본질적으로 best-effort(수 분~수십 분 지연 흔함).
    #       자동 발화가 안 보이면 Actions 탭에서 schedule 비활성 공지 + repo 활동(60일) 확인.
    - cron: '17,47 * * * *'
  workflow_dispatch: {}       # 수동 즉시 실행 버튼 (Actions 탭)

# data.json 커밋 푸시 권한
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 없으면 macro는 빈 값(사이트는 정적 폴백)
        run: node scripts/fetch-data.mjs

      - name: Commit data.json + history.json if changed
        run: |
          git config user.name "aio-data-bot"
          git config user.email "actions@github.com"
          git add public-data/data.json public-data/history.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            ts=$(date -u +"%Y-%m-%dT%H:%MZ")
            git commit -m "data: 시세/매크로/F&G 갱신 ${ts} [skip ci]"
            git push
            echo "data.json/history.json 갱신 푸시 완료"
          fi
