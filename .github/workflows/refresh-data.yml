name: Refresh market data
# Codex audit F30: the run title carries the dispatch trigger so the 30-day SLO window can tell the data-plane Worker's
# scheduler dispatches (designed cadence, P1377) from operator runs (excluded).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Refresh market data · {0}', inputs.trigger || 'operator') || 'Refresh market data' }}

# GitHub Actions fetches market/news data server-side and commits same-origin
# JSON files for the static GitHub Pages app. Schedule is offset from :00 to
# reduce best-effort cron drops during peak GitHub Actions load.

on:
  schedule:
    - cron: '17,47 * * * *'
    # Daily 13D/G·13F and outcomes lane. :33 keeps it off the :17/:47 cron that shares the refresh-data
    # concurrency group (a newer pending run cancels an older pending one). It is a trigger, not the only
    # one: the lane also runs whenever its last poll is more than 20 h old (see "Decide daily lane").
    - cron: '33 7 * * *'
  # P1377: the data-plane Worker cron dispatches with trigger=scheduler every 30 min because
  # GitHub schedules ran only every 4-6 h. Operator dispatches keep the default trigger.
  workflow_dispatch:
    inputs:
      trigger:
        description: "operator (full 13F chain) or scheduler (data cycle only)"
        required: false
        default: operator
        type: string
      retry:
        description: "set by the refresh itself on a push collision (collision); empty otherwise"
        required: false
        default: ''
        type: string

# Permissions are granted per job (producer writes data and dispatches CI; converge only reads and dispatches).
permissions: {}

jobs:
  # P1757 (owner decision 2026-10-14): weekend cadence. While NYSE and KRX are both closed (Sat ~06:00 KST after the
  # Friday US close is final, until Mon 07:00 KST; derived from the exchange-calendar registry in
  # scripts/refresh-cadence.mjs) no new prices exist, so the producer runs only as a news cycle about every hour (v57.54)
  # and the other slots stop here, before the full checkout and installs. Operator dispatches and the daily cron are
  # always full; Worker scheduler dispatches (trigger=scheduler) follow the same rule as the :17/:47 cron. A failed
  # decision leaves mode empty, which the refresh job treats as full (fail open).
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: Sparse checkout of the cadence inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/refresh-cadence.mjs
            src/domain/market/market-calendar.js
            public-data/data.json

      - name: Decide refresh mode (full, news or skip)
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_TRIGGER: ${{ inputs.trigger }}
        run: node scripts/refresh-cadence.mjs --github-output

  refresh:
    needs: cadence
    # `!cancelled()` replaces the implicit success() so a failed cadence job still runs the full producer.
    if: ${{ !cancelled() && needs.cadence.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # P1666: the producer job alone owns the shared refresh lock. Waiting for CI and Pages moved to the
    # converge job below, which used to hold this lock for 5-9 minutes and delay the next refresh slot.
    concurrency:
      group: refresh-data
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.dispatch.outputs.sha }}
    # Includes waiting for the dispatched CI run to produce its attestation
    # before handing the run id to Pages (see ensure-live-convergence.mjs).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Fetch market data
        id: fetch-market
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_PROXY_URL: ${{ vars.AIO_PROXY_URL || 'https://aio-proxy.zmfhd007.workers.dev' }}
          AIO_AUTOMATION_TOKEN: ${{ secrets.AIO_AUTOMATION_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          AIO_OBSERVE_PROXY_HEALTH: '1'
        run: node scripts/fetch-data.mjs

      - name: Capture redacted market snapshot diagnostics
        id: snapshot-diagnostic
        if: ${{ always() && !cancelled() }}
        env:
          AIO_MARKET_FETCH_OUTCOME: ${{ steps.fetch-market.outcome }}
        run: node scripts/ci-data-refresh-audit.mjs --write-snapshot-diagnostic "$RUNNER_TEMP/market-snapshot-diagnostic.json"

      - name: Upload failed market snapshot diagnostics
        if: ${{ always() && !cancelled() && steps.snapshot-diagnostic.outputs.capture == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-snapshot-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/market-snapshot-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Fetch Telegram digest
        id: fetch-telegram
        # P1085: an unavailable quote plane used to abort the whole job, so this
        # independent lane and the 13F lane produced nothing and their gates never
        # ran — one provider outage looked like a total pipeline outage. Each lane
        # now runs and reports on its own; publication stays fail-closed below.
        if: ${{ !cancelled() }}
        env:
          TG_PAGE_LIMIT: 50
        run: node scripts/fetch-telegram-digest.mjs --days=14 --out=public-data/telegram-digest.json

      - name: Restore daily-lane poll marker
        # The daily cron is best-effort and its pending run can be cancelled by a newer one in the same
        # concurrency group, so the lane is also due by age. filing-discovery.json's generatedAt only moves
        # when the SEC evidence changes (semantic writes), so it alone would keep the lane "due" on every
        # 30-minute cycle after a quiet day; this marker records the last successfully published poll.
        id: daily-lane-marker
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/daily-lane
          key: daily-lane-marker-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-lane-marker-

      - name: Decide daily lane (13D/G·13F poll and outcome refresh)
        id: daily-lane
        if: ${{ !cancelled() }}
        env:
          OPERATOR_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger != 'scheduler' }}
          DAILY_CRON: ${{ github.event.schedule == '33 7 * * *' }}
        run: |
          set -euo pipefail
          if [[ "$OPERATOR_DISPATCH" == "true" ]]; then
            due=true; mode=operator; reason=operator-dispatch
          elif [[ "$DAILY_CRON" == "true" ]]; then
            due=true; mode=daily; reason=daily-cron
          else
            # Due when the newest known poll (marker, or the artifact's own clock fields) is > 20 h old or unknown.
            age_hours="$(node scripts/daily-lane-age.mjs)"
            if [[ "$age_hours" == "unknown" || "$age_hours" -gt 20 ]]; then
              due=true; mode=daily; reason="last-poll-age-${age_hours}h"
            else
              due=false; mode=none; reason="last-poll-age-${age_hours}h"
            fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Daily lane due=$due mode=$mode reason=$reason"

      - name: Refresh past stress-band outcomes (daily lane, P1661)
        id: stress-outcomes
        if: ${{ !cancelled() && steps.daily-lane.outputs.due == 'true' }}
        continue-on-error: true
        run: node scripts/build-stress-outcomes.mjs

      - name: Refresh long-history scenario outcomes (daily lane, P1743)
        id: scenario-outcomes
        if: ${{ !cancelled() && steps.daily-lane.outputs.due == 'true' }}
        continue-on-error: true
        run: node scripts/build-scenario-outcomes.mjs

      - name: Refresh per-market price temperature (every refresh, self-throttled to 4 hours, v57.54)
        # S&P 500, Nasdaq, KOSPI, KOSDAQ, Nikkei daily closes → component ranks, extreme spells and past-spell outcomes.
        # A failure keeps the previous artifact; a market that fails keeps its previous body.
        id: market-temperature
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 8 # v58.77 pipeline audit DATA-04: the auxiliary lane cannot use up the job's time budget
        run: node scripts/build-market-temperature.mjs

      - name: Refresh weekly SEC 13F and daily 13D-G discovery
        id: masters
        if: ${{ !cancelled() && steps.daily-lane.outputs.due == 'true' }}
        # v58.71 (pipeline audit): a 13F failure (an unguarded SEC read, a contract check in this step) dropped the market,
        # news and Telegram commit too, and the lane stayed due, so the next cycles repeated the block. The step is now a
        # degradable lane: on failure its files go back to HEAD below and the rest of the cycle publishes; the poll marker
        # is not written, so the lane is retried next cycle.
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          MASTERS_MODE: ${{ steps.daily-lane.outputs.mode }}
          # v58.56: optional — without it OpenFIGI's keyless limit applies (the collector then asks fewer CUSIPs per run).
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          set -euo pipefail
          run_full_13f() {
            node scripts/collect-13f-discovery.mjs
            node scripts/collect-13f-reference.mjs
            node scripts/collect-13f-history-index.mjs
            node scripts/collect-13f-history-rows.mjs
            node scripts/build-13f-issuer-aggregates.mjs
            # v58.56: CUSIP → ticker (OpenFIGI, exact US common stock only); a failure or missing network ends cleanly.
            node scripts/collect-13f-figi-tickers.mjs || echo "::warning::OpenFIGI CUSIP mapping skipped"
            node scripts/build-masters-runtime-artifacts.mjs
            node scripts/build-13f-reference-ticker-index.mjs
          }
          if [[ "$MASTERS_MODE" != "operator" ]]; then
            # Daily lane (cron or age-due): poll 13D/G. Import quarter rows weekly only within the SEC
            # filing window, or immediately when a new HR/HR-A is unconnected.
            ownership_result="$(node scripts/collect-13f-discovery.mjs --ownership-only)"
            printf '%s\n' "$ownership_result"
            pending_13f_hr="$(node --input-type=module -e 'process.stdout.write(String(JSON.parse(process.argv[1]).pending13fHrTriggers.length))' "$ownership_result")"
            in_filing_season="$(node --input-type=module -e 'process.stdout.write(String(JSON.parse(process.argv[1]).in13fFilingSeason))' "$ownership_result")"
            if [[ "$pending_13f_hr" -gt 0 || ( "$(date -u +%u)" == "1" && "$in_filing_season" == "true" ) ]]; then
              run_full_13f
            fi
          else
            # Explicit operator dispatches always run the full 13F row/history chain.
            run_full_13f
          fi
          node scripts/ci-13f-currentness-check.mjs
          node scripts/ci-masters-contract-check.mjs
          # v58.81 (P2093/R729): the 13F files' size budgets are checked here, inside the degradable lane. On 10/26 a Monday full chain
          # grew filings.json to 502 KB (budget 460 KB); the check only ran in the data gate below, which refused the market,
          # news and Telegram commit for 7 cycles in a row while the US pre-market was open. Over budget, the restore step
          # below puts the 13F files back to the last publish and the rest of the cycle publishes.
          node scripts/ci-artifact-size-headroom-check.mjs --only masters-

      - name: Restore 13F files after a failed 13F lane (v58.71)
        id: masters-restore
        if: ${{ !cancelled() && steps.masters.outcome == 'failure' }}
        run: |
          set -euo pipefail
          # Tracked files go back to HEAD; files the failed run created are removed so nothing half-written is staged.
          git checkout -- public-data/masters public-data/objects/masters
          git ls-files --others --exclude-standard -z -- public-data/masters public-data/objects/masters | xargs -0 -r rm -f --
          echo "::warning::13F lane failed this cycle; its files stay at the last publish and the lane is retried next cycle."

      - name: Prepare official-reference ledger key (P1734)
        # The lane runs only when this cycle can actually publish; its call ledger lives in the Actions cache
        # (not public-data), so calls from a cycle whose commit is later lost still count toward the caps.
        id: official-ref-ledger
        if: ${{ !cancelled() && steps.fetch-market.outcome == 'success' && steps.fetch-telegram.outcome == 'success' }}
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore official-reference call ledger (P1734)
        id: official-ref-restore
        if: ${{ !cancelled() && steps.official-ref-ledger.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/official-references
          key: official-ref-ledger-${{ steps.official-ref-ledger.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            official-ref-ledger-${{ steps.official-ref-ledger.outputs.month }}-

      - name: Verify official web references (P1734)
        # Hosted search runs only for items whose release is due (at most once per KST day per item,
        # daily and monthly lane caps); a value is published only after the official page text confirms it.
        # A failed lane keeps the previous artifact and never blocks the market publish.
        id: official-references
        if: ${{ !cancelled() && steps.official-ref-ledger.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          AI_PROXY_URL: ${{ vars.AIO_PROXY_URL || 'https://aio-proxy.zmfhd007.workers.dev' }}
          AIO_AUTOMATION_TOKEN: ${{ secrets.AIO_AUTOMATION_TOKEN }}
        run: node scripts/refresh-web-research.mjs

      - name: Save official-reference call ledger (P1734)
        id: official-ref-save
        if: ${{ !cancelled() && steps.official-ref-ledger.outcome == 'success' && steps.official-references.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/official-references
          key: official-ref-ledger-${{ steps.official-ref-ledger.outputs.month }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Recompute forward scenarios, score new releases, log transitions (every refresh, P1743)
        # No network: reads the artifacts this run just wrote. A failure keeps the previous state artifact.
        id: scenario-state
        if: ${{ !cancelled() && steps.fetch-market.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/build-scenario-state.mjs

      - name: Promote one data release revision
        if: ${{ !cancelled() }}
        run: node scripts/sync-data-release-manifests.mjs

      - name: Install gate dependencies
        # The data QA group includes gates that parse workflow YAML (js-yaml). No browsers are downloaded.
        id: gate-deps
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        # v58.82: this job holds a contents:write token in .git/config; no dependency install script runs beside it
        # (the same --ignore-scripts as pages-deploy.yml).
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Contain a failing degradable lane
        # v58.70 (owner 2026-10-23): when every artifact-semantics failure belongs to a degradable lane (news, narrative,
        # macro freshness markers), that lane goes back to the last published value or is flagged, data.meta.laneQuarantine
        # says so, and the rest of the refresh publishes. Any untagged failure leaves data.json as produced, and the gates
        # below refuse the refresh as before (34 of 100 refreshes 10/21-10/23 were refused on one lane).
        id: lane-quarantine
        if: ${{ !cancelled() && steps.fetch-market.outcome == 'success' }}
        run: node scripts/quarantine-degradable-lanes.mjs

      - name: Reject silent artifact degradation
        id: degradation-gate
        if: ${{ !cancelled() }}
        run: node scripts/ci-refresh-artifact-integrity-check.mjs

      - name: Validate source-to-consumer data continuity
        id: continuity-gate
        if: ${{ !cancelled() }}
        run: node scripts/ci-data-continuity-check.mjs

      - name: Validate evidence-derived 22-category reconciliation
        id: reconciliation-gate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/verify-refresh-candidate.mjs --self-test
          # The whole CI data group (reconciliation, source registry, data gaps, static data, the full refresh
          # audit ci-data-refresh-audit.mjs, history-field time, release parity, ...) runs here, not a hand-picked
          # subset: CI rejected bot pushes on gates this list had omitted (ci-history-field-time-contract-check.mjs). ~10 s.
          AIO_QA_CACHE_DIR="$RUNNER_TEMP/aio-qa" node scripts/qa-runner.mjs --group data --no-cache
          node scripts/ci-web-research-contract-check.mjs
          node scripts/verify-refresh-candidate.mjs --record "$RUNNER_TEMP/aio-refresh-data-candidate.json"

      - name: Fail-closed promotion candidate gate before push
        id: promotion-gate
        # The bot may publish a data commit before the independent CI run, but
        # only after the complete producer-side artifact boundary passes. CI
        # still receives the exact pushed SHA and Pages waits for its attestation.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git diff --check
          node scripts/verify-refresh-candidate.mjs --expect "$RUNNER_TEMP/aio-refresh-data-candidate.json"

      - name: Pipeline status summary
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { marketAnalysisDiagnostic } from './scripts/lib/operational-health.mjs';
          try {
            const d = JSON.parse(fs.readFileSync('public-data/data.json', 'utf8'));
            const m = d.meta || {};
             const ts = m.generatedAt ? new Date(m.generatedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : 'n/a';
             const generatedAtMs = Date.parse(m.generatedAt || '');
             const generatedStatus = Number.isFinite(generatedAtMs) ? 'OK' : 'WARN';
             const elapsedMs = Number(m.elapsedMs);
             const elapsedStatus = Number.isFinite(elapsedMs) && elapsedMs > 0 ? 'OK' : 'WARN';
             const totalSymbols = (m.symbolsOk || 0) + (m.symbolsFail || 0);
            const rows = [
              '| Layer | Status | Value |',
              '|------|------|-----|',
              `| Generated (KST) | ${generatedStatus} | ${ts} |`,
              `| Quotes | ${m.symbolsOk >= 70 ? 'OK' : 'WARN'} | ${m.symbolsOk || 0}/${totalSymbols} failed: ${(m.failedSymbols || []).join(',') || 'none'} |`,
              `| Twelve Data fallback | ${m.tdHasKey ? 'OK' : 'SKIP'} | hasKey=${m.tdHasKey} eligible=${m.tdFallbackEligible || 0} recovered=${m.tdFallbackRecovered || 0} |`,
              `| Fear&Greed | ${m.fearGreedOk ? 'OK' : 'WARN'} | ${d.fearGreed && d.fearGreed.score != null ? d.fearGreed.score : 'n/a'} |`,
              `| Cboe Put/Call | ${m.putCallOk ? 'OK (delayed)' : 'WARN'} | ${d.putCall && d.putCall.totalPutCall != null ? d.putCall.totalPutCall + ' · ' + (d.putCall.asOf || 'date n/a') : 'n/a'} |`,
              `| FRED Secret | ${m.fredHasKey ? (m.fredFailedSeries && m.fredFailedSeries.length ? 'WARN' : 'OK') : 'MISSING'} | fredFetchOk: ${m.fredFetchOk ? 'yes (' + (m.macroKeyCount || 0) + ' keys)' : 'no'}${m.fredFailedSeries && m.fredFailedSeries.length ? ' · failed: ' + m.fredFailedSeries.join(',') : ''} |`,
              `| FRED LKG | ${m.fredLkgUsed ? 'REFERENCE' : 'N/A'} | source=${m.fredLkgSource || 'none'} · original observation dates retained |`,
              `| BLS official | ${m.blsStatus === 'ok' || m.blsStatus === 'cached-fresh' ? 'OK' : m.blsStatus === 'partial' ? 'PARTIAL' : 'WARN'} | status=${m.blsStatus || 'unavailable'} series=${m.blsSeriesCount || 0}/6 failed=${(m.blsFailedSeries || []).join(',') || 'none'} lastSuccessfulAt=${m.blsLastSuccessfulAt || 'none'} |`,
              `| Treasury curve | ${m.treasuryStatus === 'ok' || m.treasuryStatus === 'cached-fresh' ? 'OK' : 'WARN'} | status=${m.treasuryStatus || 'unavailable'} observed=${m.treasuryObservedAt || 'none'} same-date 10Y-2Y only |`,
              `| AAII weekly | ${m.aaiiStatus === 'current-reference' ? 'REFERENCE' : 'WARN'} | observed=${m.aaiiObservedAt || 'none'} relay=${m.aaiiRelayUsed ? 'bounded-reader' : 'direct/none'} decisionUse=false |`,
              `| News | ${m.newsOk ? 'OK' : 'WARN'} | ${m.newsCount || 0} items · ${m.newsCycleLabel || 'cycle n/a'} |`,
              `| Lane quarantine | ${(m.laneQuarantine || []).length ? 'DEGRADED' : 'OK'} | ${(m.laneQuarantine || []).map((e) => `${e.lane} ${e.remedy} since ${e.since}`).join(', ').replace(/[|\r\n]/g, ' ') || 'none'} |`,
              `| LLM Analysis | ${m.marketAnalysisOk ? 'OK' : 'WARN'} | ${m.marketAnalysisOk ? ((d.marketAnalysis && d.marketAnalysis.model) || 'model n/a') : marketAnalysisDiagnostic(d).replace(/[|\r\n]/g, ' ')} |`,
              `| Fundamentals | ${Number(m.fundamentalCoveragePct || 0) >= 80 ? 'OK' : 'PARTIAL'} | free SEC companyfacts=${m.secFundamentalsCount || 0} coverage=${m.fundamentalCoveragePct || 0}% · paid FMP not required |`,
              `| Elapsed | ${elapsedStatus} | ${Number.isFinite(elapsedMs) ? elapsedMs : 'n/a'}ms |`,
            ].join('\n');
            const summary = `## Data refresh summary\n\n${rows}\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY || '/dev/null', summary);
            console.log(summary);
           } catch(e) {
             console.error('summary generation failed:', e.message);
             process.exitCode = 1;
           }
          NODE

      - name: Commit refreshed public data if changed
        id: commit
        # Publication stays deliberately fail-closed: every producer lane must have
        # succeeded (or been legitimately skipped) before anything reaches main.
        # Lane isolation above changes attribution and diagnostics, not this gate.
        # P1160: this condition used to check ONLY the producer lanes, so the four validation
        # gates above — including the step literally named "Fail-closed promotion candidate gate
        # before push" — could fail and the commit still ran. Observed 2026-09-20: steps 10 and 11
        # failed on an A1 CRITICAL freshness breach, and the bot pushed 85d05825 anyway, leaving
        # main permanently red and Pages unable to deploy. The comment above claimed publication
        # "stays deliberately fail-closed"; nothing enforced it. Now it does.
        if: ${{ !cancelled() && steps.fetch-market.outcome == 'success' && steps.fetch-telegram.outcome == 'success' && (steps.masters.outcome == 'success' || steps.masters.outcome == 'skipped' || steps.masters-restore.outcome == 'success') && steps.degradation-gate.outcome == 'success' && steps.continuity-gate.outcome == 'success' && steps.reconciliation-gate.outcome == 'success' && steps.promotion-gate.outcome == 'success' }}
        # P564/R255: this used to `git push` once with no pull/rebase beforehand. main is also
        # updated directly by humans (e.g. editing operator-note.json via the GitHub web UI)
        # and by other sessions/workflows while this job's two fetch steps run for minutes —
        # a real merge commit (34b9e1a) proved this race actually happens. A bare push that
        # loses the race just fails outright with no retry, silently dropping that cycle's
        # data refresh until the next scheduled run. Now rebase onto the latest main and retry
        # a bounded number of times before giving up loudly.
        # Pipeline redesign (2026-10-19): a rebase conflict, or a clean rebase whose tree no longer matches the validated
        # candidate (a human commit touched a file this run produced, e.g. a version bump in the release manifests), used to
        # end the run red and drop the cycle until the next slot. The candidate cannot be republished unvalidated, so the run
        # now dispatches one immediate refresh from the new main (trigger=scheduler: automated, weekend rule, no 13F chain;
        # retry=collision) and ends without publishing. A retry that collides again fails loudly instead of looping.
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_RETRY: ${{ inputs.retry }}
        run: |
          set -euo pipefail
          git config user.name "aio-data-bot"
          git config user.email "actions@github.com"
          stage_if_exists() {
            if [ -e "$1" ]; then
              git add -- "$1"
            fi
          }
          git add -- public-data/data.json public-data/history.json
          stage_if_exists public-data/macro-history.json # P1426: 거시 direction reads
          stage_if_exists public-data/macro-calendar.json # P1654: FRED release schedule
          stage_if_exists public-data/stress-outcomes.json # P1661: VIX-band forward outcomes
          stage_if_exists public-data/today-verdict.json # v58.80 F01: first-paint verdict (build-scenario-state)
          stage_if_exists public-data/scenario-outcomes.json # P1743: long-history branch/theme-stage outcomes (weekly)
          stage_if_exists public-data/scenario-state.json # P1743: per-refresh branches, themes, transitions, scored releases
          stage_if_exists public-data/market-temperature.json # v57.54: per-market price temperature (4-hour throttle)
          stage_if_exists public-data/official-references.json # P1734: page-verified official web references
          stage_if_exists public-data/market-snapshot.json
          stage_if_exists public-data/market-snapshot-status.json
          stage_if_exists public-data/operations-status.json
          stage_if_exists public-config.json
          stage_if_exists public-data/reconciliation-status.json
          stage_if_exists public-data/screener.json
          stage_if_exists public-data/telegram-digest.json
          stage_if_exists public-data/telegram-observed.json # P1683: lineage rows split out of the served digest
          stage_if_exists public-data/atlas/index.json
          stage_if_exists public-data/backtest-history.json
          stage_if_exists public-data/score-backtest-history.json
          stage_if_exists public-data/structural-data-research.json
          stage_if_exists public-data/masters/filing-discovery.json
          stage_if_exists public-data/masters/filings.json
          stage_if_exists public-data/masters/manager-catalog.json
          stage_if_exists public-data/masters/index.json
          stage_if_exists public-data/masters/holdings.json
          stage_if_exists public-data/masters/holdings-summary.json
          stage_if_exists public-data/masters/history-index.json
          stage_if_exists public-data/masters/history-holdings.json
          stage_if_exists public-data/masters/issuer-aggregates.json
          stage_if_exists public-data/masters/ticker-index-reference.json
          stage_if_exists public-data/masters/cusip-ticker-map.json
          stage_if_exists public-data/masters/managers
          stage_if_exists public-data/objects/masters
          stage_if_exists public-data/masters/history/managers
          git add -- architecture/asset-manifest.json architecture/release-manifest.json architecture/public-readiness.json
          node scripts/ci-masters-contract-check.mjs --staged
          node scripts/verify-refresh-candidate.mjs --expect-staged "$RUNNER_TEMP/aio-refresh-data-candidate.json"
          # GitHub warns at 50 MB and rejects a push containing a file over 100 MB. Fail before the commit,
          # naming the file. P1757: sec-fundamentals.json (~67 MB) no longer lives on main (data-store branch),
          # so no staged file is exempt.
          # v57.89: the 13F manager row ledgers are written through scripts/lib/masters-manager-store.mjs, which splits any
          # manager over 32 MiB into <id>.json + <id>.part-N.json (BlackRock 60.5 MB -> 31.9 + 25.8 MiB), so no producer
          # writes a file near 50 MB by design; the v57.88 interim 95 MB ceiling is back to 50 MB, matching refresh-screener.
          # The scheduled headroom check (ci-artifact-size-headroom-check.mjs) warns from 40 MiB, before this stop is reached.
          oversized=""
          while IFS= read -r -d '' staged; do
            [ -f "$staged" ] || continue
            bytes="$(stat -c %s -- "$staged")"
            if [ "$bytes" -gt 52428800 ]; then oversized="$oversized $staged($((bytes / 1048576))MB)"; fi
          done < <(git diff --staged --name-only -z --diff-filter=ACMR)
          if [ -n "$oversized" ]; then
            echo "::error::staged file(s) over the 50 MB publish limit:$oversized"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "No public-data changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%dT%H:%MZ")
          # P572/R263: this commit message used to carry "[skip ci]". After P557/R248 moved
          # GitHub Pages from legacy branch-deploy to the CI-gated deploy job, [skip ci]
          # skipped that entire workflow — deploy included — so every 2-hourly data refresh
          # landed in the repo but never reached the live site (confirmed live: data.json
          # 13h+ stale while watchdog reported success). Data commits MUST run CI so the
          # deploy job publishes them; validate gating them is a feature, not a cost.
          git commit -m "data: refresh market and news data ${ts}"
          collision_retry() {
            reason="$1"
            git rebase --abort >/dev/null 2>&1 || true
            if [[ "${DISPATCH_RETRY:-}" == "collision" ]]; then
              echo "::error::${reason} again on the collision retry — main is changing the files this refresh produces; not retrying further."
              exit 1
            fi
            gh workflow run refresh-data.yml --ref main -f trigger=scheduler -f retry=collision
            echo "::warning::${reason}; this cycle is re-run from the new main by a dispatched collision retry."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "collision=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          node scripts/verify-refresh-candidate.mjs --expect-commit "$RUNNER_TEMP/aio-refresh-data-candidate.json"
          attempt=1
          max_attempts=5
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after ${max_attempts} attempts — main moved faster than this job could catch up."
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}) — fetching latest main and rebasing"
            git fetch origin main
            # A conflicting concurrent edit cannot be resolved by retrying; leave no half-applied rebase behind.
            git rebase origin/main || collision_retry "rebase conflict on $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            node scripts/verify-refresh-candidate.mjs --expect-commit "$RUNNER_TEMP/aio-refresh-data-candidate.json" || collision_retry "the rebased tree no longer matches the validated candidate"
            attempt=$((attempt + 1))
            # Jitter so two producers that lost the same race do not retry in lockstep.
            sleep $((attempt * 3 + RANDOM % 5))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed refreshed public-data files"

      - name: Dispatch exact produced commit to CI
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref main -f release_sha="$final_sha" -f origin="refresh-data"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Dispatched CI for exact refresh commit $final_sha"

      # v57.92 (audit W03): the marker was restored above but never written or saved, so after a quiet SEC day the
      # artifact clock alone kept the daily lane "due" on every 30-minute cycle. It is written only after the daily
      # poll succeeded and its result passed every gate and the commit step (a no-change commit counts) — a failed
      # cycle leaves the marker where it was, so the lane stays due.
      # v58.63 (architecture audit A21/WF01): a commit step that lost a main race exits 0 with collision=true and publishes
      # nothing; that poll's evidence was discarded, so it must not stamp the lane as polled (the retry would skip it).
      - name: Record daily-lane poll marker
        id: daily-lane-marker-write
        if: ${{ !cancelled() && steps.daily-lane.outputs.due == 'true' && steps.masters.outcome == 'success' && steps.commit.outcome == 'success' && steps.commit.outputs.collision != 'true' }}
        continue-on-error: true
        run: node scripts/daily-lane-age.mjs --write-marker

      - name: Save daily-lane poll marker
        if: ${{ !cancelled() && steps.daily-lane-marker-write.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/daily-lane
          key: daily-lane-marker-${{ github.run_id }}-${{ github.run_attempt }}

  converge:
    needs: [cadence, refresh]
    # Runs even when the producer failed so a lost hand-over self-heals (R606). A weekend skip slot (P1757) has
    # nothing to hand over; the next news cycle, about an hour later, converges instead.
    if: ${{ !cancelled() && needs.cadence.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    # The driver gives up waiting after 12 min (AWAITING_CI_ATTESTATION) and the next cycle's converge
    # finds the attested run and dispatches Pages (R606 self-heal), so a 30-minute hold bought nothing.
    timeout-minutes: 15
    # Reads main/runs/artifacts and dispatches ci.yml / pages-deploy.yml; it never writes the repository.
    permissions:
      contents: read
      actions: write
    concurrency:
      group: live-convergence
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Converge live deployment to the attested revision
        # R606: a workflow_dispatch run created with the built-in GITHUB_TOKEN does
        # not emit workflow_run, so this run's attestation had no consumer and data
        # commits stopped reaching the live site (2026-09-17: 5 commits / 13.4h
        # stale). This step waits for the run it just created and hands the exact
        # run id to pages-deploy, which still validates the attestation artifact.
        # `!cancelled()` so a lost hand-off self-heals on the next scheduled cycle
        # even when this cycle failed before committing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ needs.refresh.outputs.sha }}" ]; then
            node scripts/ensure-live-convergence.mjs --await-sha "${{ needs.refresh.outputs.sha }}" --timeout-min 12
          else
            node scripts/ensure-live-convergence.mjs
          fi
