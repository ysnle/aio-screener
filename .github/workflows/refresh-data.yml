name: Refresh market data

# 왜: 브라우저 대신 GitHub 서버가 데이터를 받아 public-data/data.json으로 떨군다.
# CORS/프록시/키노출 없이 항상 신선. 정적 사이트는 같은 출처 data.json만 읽는다.
# 사용자가 손댈 일 없음 — 이 워크플로가 알아서 돈다.

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 (크립토/FX 24h + 미국/한국장 커버). 빈도 조절은 이 줄만 수정.
  workflow_dispatch: {}       # 수동 즉시 실행 버튼 (Actions 탭)

# data.json 커밋 푸시 권한
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 없으면 macro는 빈 값(사이트는 정적 폴백)
        run: node scripts/fetch-data.mjs

      - name: Commit data.json if changed
        run: |
          git config user.name "aio-data-bot"
          git config user.email "actions@github.com"
          git add public-data/data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            ts=$(date -u +"%Y-%m-%dT%H:%MZ")
            git commit -m "data: 시세/매크로/F&G 갱신 ${ts} [skip ci]"
            git push
            echo "data.json 갱신 푸시 완료"
          fi
