name: Refresh market data

# GitHub Actions fetches market/news data server-side and commits same-origin
# JSON files for the static GitHub Pages app. Schedule is offset from :00 to
# reduce best-effort cron drops during peak GitHub Actions load.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Fetch Telegram digest
        env:
          TG_PAGE_LIMIT: 30
        run: node scripts/fetch-telegram-digest.mjs --days=7 --out=public-data/telegram-digest.json

      - name: Pipeline status summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          try {
            const d = JSON.parse(fs.readFileSync('public-data/data.json', 'utf8'));
            const m = d.meta || {};
            const ts = m.generatedAt ? new Date(m.generatedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : 'n/a';
            const totalSymbols = (m.symbolsOk || 0) + (m.symbolsFail || 0);
            const rows = [
              '| Layer | Status | Value |',
              '|------|------|-----|',
              `| Generated (KST) | OK | ${ts} |`,
              `| Quotes | ${m.symbolsOk >= 70 ? 'OK' : 'WARN'} | ${m.symbolsOk || 0}/${totalSymbols} failed: ${(m.failedSymbols || []).join(',') || 'none'} |`,
              `| Fear&Greed | ${m.fearGreedOk ? 'OK' : 'WARN'} | ${d.fearGreed && d.fearGreed.score != null ? d.fearGreed.score : 'n/a'} |`,
              `| FRED Secret | ${m.fredHasKey ? 'OK' : 'MISSING'} | fredFetchOk: ${m.fredFetchOk ? 'yes (' + (m.macroKeyCount || 0) + ' keys)' : 'no'} |`,
              `| News | ${m.newsOk ? 'OK' : 'WARN'} | ${m.newsCount || 0} items · ${m.newsCycleLabel || 'cycle n/a'} |`,
              `| LLM Analysis | ${m.marketAnalysisOk ? 'OK' : 'WARN'} | ${m.marketAnalysisOk ? ((d.marketAnalysis && d.marketAnalysis.model) || 'model n/a') : 'ANTHROPIC_API_KEY missing or generation failed'} |`,
              `| Elapsed | OK | ${m.elapsedMs || 0}ms |`,
            ].join('\n');
            const summary = `## Data refresh summary\n\n${rows}\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY || '/dev/null', summary);
            console.log(summary);
          } catch(e) {
            console.warn('summary generation failed (non-fatal):', e.message);
          }
          NODE

      - name: Commit refreshed public data if changed
        run: |
          git config user.name "aio-data-bot"
          git config user.email "actions@github.com"
          git add public-data/data.json public-data/history.json
          [ -f public-data/screener.json ] && git add public-data/screener.json || true
          [ -f public-data/telegram-digest.json ] && git add public-data/telegram-digest.json || true
          if git diff --staged --quiet; then
            echo "No public-data changes to commit"
          else
            ts=$(date -u +"%Y-%m-%dT%H:%MZ")
            git commit -m "data: refresh market and news data ${ts} [skip ci]"
            git push
            echo "Pushed refreshed public-data files"
          fi
