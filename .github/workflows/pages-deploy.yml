name: Deploy GitHub Pages

# Every release deploys only the immutable SHA attested by a successful CI run.
# Data refresh jobs explicitly dispatch CI with the commit they produced; Pages
# never resolves a mutable branch after validation.
#
# R606: a workflow_dispatch run created with the built-in GITHUB_TOKEN does not
# emit a workflow_run event, so the attestation produced by a bot-dispatched CI
# run had no consumer — the refresh bot kept committing while the live site
# stopped publishing (observed 2026-09-17: five bot commits, live artifact 13.4h
# stale, watchdog red). The `workflow_dispatch` path below lets the producer hand
# over the exact CI run id it just created. It does NOT relax the gate: the same
# attestation artifact is downloaded from that run and the same SHA equality is
# asserted, and the run's own conclusion/branch/sha are re-asserted via the API
# so a dispatched hand-over is exactly as strict as a workflow_run.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Completed CI run that produced the release attestation
        required: true
        type: string
      expected_sha:
        description: Exact lowercase 40-hex SHA that CI attested
        required: true
        type: string

concurrency:
  group: aio-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve attested release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_RUN_ID: ${{ github.event.inputs.ci_run_id }}
          DISPATCH_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            run_id="$WORKFLOW_RUN_ID"
            expected_sha="$WORKFLOW_SHA"
          else
            run_id="$DISPATCH_RUN_ID"
            expected_sha="$DISPATCH_SHA"
          fi
          case "$run_id" in ''|null) echo "::error::deploy requires a CI run id"; exit 1;; esac
          case "$expected_sha" in *[!0-9a-f]*) echo "::error::expected sha must be lowercase hex: $expected_sha"; exit 1;; esac
          [ "${#expected_sha}" -eq 40 ] || { echo "::error::expected sha must be 40 hex characters: $expected_sha"; exit 1; }

          # A dispatched hand-over is re-checked against the same conditions the
          # workflow_run path enforces, so the extra entry point cannot publish a
          # revision that CI never validated.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            --jq '[.conclusion, (.head_branch // ""), (.head_sha // "")] | @tsv' > "$RUNNER_TEMP/ci-run.tsv"
          IFS="$(printf '\t')" read -r ci_conclusion ci_branch ci_sha < "$RUNNER_TEMP/ci-run.tsv"
          [ "$ci_conclusion" = 'success' ] || { echo "::error::CI run $run_id concluded '$ci_conclusion', expected success"; exit 1; }
          [ "$ci_branch" = 'main' ] || { echo "::error::CI run $run_id ran on '$ci_branch', expected main"; exit 1; }
          [ "$ci_sha" = "$expected_sha" ] || { echo "::error::CI run $run_id tested '$ci_sha', expected $expected_sha"; exit 1; }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved attested release: run=$run_id sha=$expected_sha branch=$ci_branch"

      - name: Download CI release attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aio-release-attestation
          path: ${{ runner.temp }}/release-attestation
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Validate release attestation
        id: release
        env:
          WORKFLOW_SHA: ${{ steps.source.outputs.expected_sha }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/release-attestation/aio-release-attestation.json"
          sha="$(node -e "const a=require(process.argv[1]); if(a.schemaVersion!=='aio-release-attestation.v1'||!/^([0-9a-f]{40})$/.test(a.testedSha)) process.exit(1); process.stdout.write(a.testedSha)" "$file")"
          test "$sha" = "$WORKFLOW_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact attested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stage explicit public artifact allowlist
        env:
          AIO_SOURCE_SHA: ${{ steps.release.outputs.sha }}
          AIO_ATTESTATION_RUN_ID: ${{ steps.source.outputs.run_id }}
          AIO_DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-dist/js" "$RUNNER_TEMP/pages-dist/src" "$RUNNER_TEMP/pages-dist/public-data"
          cp index.html sw.js version.json og-image.svg robots.txt sitemap.xml public-artifact-manifest.json public-config.json _headers "$RUNNER_TEMP/pages-dist/"
          cp js/aio-core.js js/aio-data.js js/aio-ui.js js/aio-chat.js js/aio-glossary.js "$RUNNER_TEMP/pages-dist/js/"
          rsync -a src/ "$RUNNER_TEMP/pages-dist/src/"
          # Canonical bulk ledgers stay producer-side until retention-managed object storage is
          # configured. Pages receives only bounded projections and referenced immutable objects.
          rsync -a \
            --exclude 'sec-fundamentals.json' \
            --exclude 'masters/holdings.json' \
            --exclude 'masters/history-holdings.json' \
            --exclude 'masters/issuer-aggregates.json' \
            --exclude 'masters/managers/' \
            public-data/ "$RUNNER_TEMP/pages-dist/public-data/"
          node --input-type=module -e "import fs from 'node:fs'; const version=JSON.parse(fs.readFileSync('version.json','utf8')).version; const artifact={schemaVersion:'aio-deployment.v1',sourceSha:process.env.AIO_SOURCE_SHA,appRevision:version,attestationRunId:Number(process.env.AIO_ATTESTATION_RUN_ID),deploymentRunId:Number(process.env.AIO_DEPLOYMENT_RUN_ID),deployedAt:new Date().toISOString()}; if(!/^[0-9a-f]{40}$/.test(artifact.sourceSha)) process.exit(1); fs.writeFileSync(process.env.RUNNER_TEMP+'/pages-dist/deployment.json',JSON.stringify(artifact,null,2)+'\n');"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Fail if both deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: |
          echo "::error::GitHub Pages deploy failed twice."
          exit 1

      - name: Verify released Pages and all external planes
        env:
          AIO_EXTERNAL_RETRY_MS: '5000'
          AIO_EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/ci-external-pipeline-check.mjs --mode release

      - name: Verify live standing invariants
        env:
          LIVE_HEADER_POLICY: operator-required
        run: node scripts/ci-live-invariant-check.mjs
