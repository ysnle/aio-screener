name: CI

# The manifest is the source of truth. Cheap gates must finish before expensive
# browser shards start; every shard reports independently so one failure does not
# hide the next one. Pages deployment lives in pages-deploy.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact bot-produced commit to validate and attest
        required: false
        type: string
      origin:
        description: Validation scope owner (refresh-data, refresh-screener or event-briefs)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_sha || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (cheap blocking gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run aggregate preflight
        env:
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: node scripts/qa-runner.mjs --group preflight --no-cache
      - name: Upload redacted QA failure output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-qa-failure-output-preflight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-qa/runs/*/failure-output/*.txt
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: Contracts / ${{ matrix.group }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.origin == 'refresh-data' && '["core","data","knowledge"]' || (inputs.origin == 'refresh-screener' || inputs.origin == 'event-briefs') && '["core","data"]' || '["core","data","knowledge","workspace","cloudflare"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore the producer-only SEC ledger for full-ledger gates (P1757)
        # sec-fundamentals.json lives on the data-store branch, not main. Restore it only when its digest equals this
        # checkout's projection manifest, so the gates compare the exact ledger that produced it; otherwise they run
        # the projection-only contract and print a labelled P1757 SKIP for the ledger comparisons.
        if: matrix.group == 'data'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sec-fundamentals-store.mjs restore --match-manifest
      - name: Run all gates in shard
        env:
          # Keep the runner reports and redacted failure sidecars outside the checkout.
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: node scripts/qa-runner.mjs --group ${{ matrix.group }} --no-cache
      - name: Upload redacted QA failure output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-qa-failure-output-contracts-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-qa/runs/*/failure-output/*.txt
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser / ${{ matrix.group }}
    # 2026-10-12: browser shards start beside the ~20 s contract shards instead of after them; attest still needs both.
    needs: preflight
    # v58.70 (owner 2026-10-23): a refresh commit changes only generated data on top of source code that already passed
    # the full push CI (the attest guard below proves it), so it is attested by the data/core/knowledge contracts alone.
    # Its browser shards depended on the apt mirror and held 10/22 04:50Z-23:20Z of data off the live site.
    # v59.49: event-briefs commits only public-data too; its full browser run failed the home text budget on brief text
    # (10-30 02:23Z, 16:43Z), so its releases were never attested.
    if: inputs.origin != 'refresh-data' && inputs.origin != 'refresh-screener' && inputs.origin != 'event-briefs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: ["browser-unit","browser-runtime","browser-knowledge","browser-resilience","browser-viewport","browser-surface"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Cache Playwright browsers
        # The Chromium build is pinned by the playwright version in package-lock.json, so the lock hash keys it.
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Identify runner image
        # 2026-10-26: the .deb cache was keyed by OS + lock only, so it kept the previous image's packages forever (a
        # cache key is never overwritten) and every shard still downloaded ~12 MB after the image moved on.
        id: runner-image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium OS packages
        # v58.68 (CI 2026-10-23): the Azure apt mirror served ~50 kB/s, so the 26 MB of Chromium libraries outlasted every
        # attempt. The downloaded .deb files are kept between jobs; apt then installs from disk and fetches only what changed.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aio-apt-archives
          key: aio-apt-archives-${{ runner.os }}-${{ steps.runner-image.outputs.id }}-${{ hashFiles('package-lock.json') }}-v2
          restore-keys: |
            aio-apt-archives-${{ runner.os }}-${{ steps.runner-image.outputs.id }}-
            aio-apt-archives-${{ runner.os }}-
      - name: Install dependencies and Chromium
        env:
          PLAYWRIGHT_BROWSERS_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          npm ci --no-audit --no-fund
          # 2026-10-12: the apt mirror is occasionally ~100 kB/s (one shard in six took 3-4 min instead of ~25 s).
          # Cap each attempt and retry on a fresh connection instead of waiting it out.
          # A cache hit already holds the browser build; only the OS libraries (apt) are installed then, because
          # the runner image does not persist them between jobs.
          # 2026-10-26: the browser build comes from the Playwright CDN, not apt, so it is fetched on its own first.
          if [ "$PLAYWRIGHT_BROWSERS_CACHED" != "true" ]; then
            for attempt in 1 2 3; do
              timeout 240 npx playwright install chromium && break
              [ "$attempt" = 3 ] && { echo "::error::playwright browser download failed 3 times"; exit 1; }
            done
          fi
          # v58.67 (CI 2026-10-23): a stalled mirror connection kept apt-get alive for 6+ minutes. apt now gives up a
          # stalled connection after 20 s and retries it itself, so one slow shard costs seconds, not the attempt.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99aio-network >/dev/null
          # v58.68: apt reads and keeps its archives in the cached folder (the cache step above).
          mkdir -p "$HOME/.cache/aio-apt-archives/partial"
          printf 'Dir::Cache::Archives "%s/.cache/aio-apt-archives/";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/98aio-archives >/dev/null
          deps_installed=false
          for attempt in 1 2; do
            if timeout 240 npx playwright install-deps chromium; then deps_installed=true; break; fi
            echo "::warning::playwright install-deps attempt $attempt timed out or failed"
            # v58.65/67: timeout stops npx, not the sudo apt-get it started, and that apt kept the dpkg lock — every
            # retry failed in two seconds (apt exit 100) and nothing deployed after 10/21 17:48. Stop the leftover apt,
            # wait for the lock, and let dpkg finish any half-configured package before retrying.
            sudo pkill -x apt-get || true
            for _ in $(seq 1 30); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || break; sleep 2; done
            sudo dpkg --configure -a || true
          done
          # apt wrote the archives as root; the cache step saves them as the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/aio-apt-archives" || true
          # 2026-10-26 (main CI red 15:45Z-17:40Z, 5 runs): the image already ships every library Chromium loads; on a
          # stalled mirror apt was stuck on optional fonts (fonts-wqy-zenhei 7.8 MB) and the libnss3/xvfb upgrades, and
          # the red browser shards kept every release and data refresh off Pages. apt stays best effort: if it could not
          # finish, the shard runs when Chromium really launches and renders, and fails only when it does not.
          if [ "$deps_installed" != true ]; then
            if node -e "const { chromium } = require('playwright'); (async () => { const browser = await chromium.launch(); const page = await browser.newPage(); await page.setContent('<p>브라우저 확인</p>'); await page.textContent('p'); await browser.close(); })().catch((error) => { console.error(error.message); process.exit(1); });"; then
              echo "::warning::apt could not install Chromium OS packages; Chromium launches without them, so the shard continues (optional fonts may be missing)"
            else
              echo "::error::apt could not install Chromium OS packages and Chromium does not launch without them"
              exit 1
            fi
          fi
      - name: Run all gates in shard
        env:
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: node scripts/qa-runner.mjs --group ${{ matrix.group }} --no-cache
      - name: Upload redacted QA failure output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-qa-failure-output-browser-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-qa/runs/*/failure-output/*.txt
          if-no-files-found: ignore
          retention-days: 7

  attest:
    name: Attest exact tested release
    # v58.70: a skipped browser job counts only for a refresh origin; every other run still needs it to succeed.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref_name == 'main'
      && needs.preflight.result == 'success' && needs.contracts.result == 'success'
      && (needs.browser.result == 'success' || (needs.browser.result == 'skipped' && (inputs.origin == 'refresh-data' || inputs.origin == 'refresh-screener' || inputs.origin == 'event-briefs')))
    needs: [preflight, contracts, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          # Commits and trees only: the attestation needs ancestry and a name-only diff, not file contents (48 s -> seconds).
          filter: blob:none
      # v58.20 review B2: a refresh-dispatched run tests a reduced group set, but the commit it attests contains every
      # human commit the refresh was rebased onto. The newest commit that changes anything outside the refresh-generated
      # paths must already have a successful full push CI; otherwise this release waits for that run to attest it.
      # First-parent history: push CI runs on the merge commit main received, not on the merged branch's own commits.
      - name: Reduced-scope release sits on a fully tested source commit
        if: inputs.origin == 'refresh-data' || inputs.origin == 'refresh-screener' || inputs.origin == 'event-briefs'
        env:
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git log -1 --first-parent --format=%H "$EXPECTED_SHA" -- . ':(exclude)public-data' ':(exclude)architecture/asset-manifest.json' ':(exclude)architecture/release-manifest.json' ':(exclude)architecture/public-readiness.json' ':(exclude)public-config.json')"
          if [ -z "$source_sha" ] || [ "$source_sha" = "$EXPECTED_SHA" ]; then
            echo "::error::reduced-scope CI cannot attest $EXPECTED_SHA: it changes files outside the refresh-generated paths"
            exit 1
          fi
          # P1952: every first-parent commit from source_sha up to (not including) this release holds the same
          # non-generated tree, so a full push CI on any of them tests this code. A local commit merged with origin/main
          # before the push leaves the merge commit (which push CI ran on) treesame to the code commit (which it did not),
          # and data releases on top of it were refused (2026-10-21: v58.55 514c501 / merge a4b1b32).
          tested=""
          for candidate in $(git rev-list --first-parent "$EXPECTED_SHA" | sed "/^$source_sha\$/q" | grep -vx "$EXPECTED_SHA"); do
            full_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$candidate&event=push&status=success&per_page=1" --jq '.total_count')"
            if [ "${full_runs:-0}" -ge 1 ] 2>/dev/null; then tested="$candidate"; break; fi
          done
          if [ -z "$tested" ]; then
            echo "::error::source commit $source_sha (and the first-parent commits above it) has no successful full push CI yet; this reduced-scope release is not attested"
            exit 1
          fi
          echo "Reduced-scope release $EXPECTED_SHA sits on fully tested source $source_sha (full push CI on $tested)"
      - name: Build immutable release attestation
        env:
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_ORIGIN: ${{ inputs.origin || 'source-push' }}
          AUTO_WORKER_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getWorkerChangesBetween } from './scripts/worker-deploy-impact.mjs';
          const workerDeploy = process.env.AUTO_WORKER_DEPLOY === 'true'
            ? await getWorkerChangesBetween(process.env.PUSH_BEFORE_SHA, process.env.EXPECTED_SHA)
            : { dataPlane: false, aiProxy: false };
          const version = JSON.parse(fs.readFileSync('version.json', 'utf8')).version;
          fs.mkdirSync('.release', { recursive: true });
          fs.writeFileSync('.release/aio-release-attestation.json', JSON.stringify({
            schemaVersion: 'aio-release-attestation.v1',
            testedSha: process.env.EXPECTED_SHA,
            appRevision: version,
            origin: process.env.RELEASE_ORIGIN,
            runId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            workerDeploy,
            attestedAt: new Date().toISOString()
          }, null, 2) + '\n');
          NODE
      - name: Upload release attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-release-attestation
          path: .release/aio-release-attestation.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
