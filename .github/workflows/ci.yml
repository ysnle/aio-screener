name: CI

# The manifest is the source of truth. Cheap gates must finish before expensive
# browser shards start; every shard reports independently so one failure does not
# hide the next one. Pages deployment lives in pages-deploy.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact bot-produced commit to validate and attest
        required: false
        type: string
      origin:
        description: Validation scope owner (refresh-data or refresh-screener)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_sha || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (cheap blocking gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run aggregate preflight
        run: node scripts/qa-runner.mjs --group preflight --no-cache

  contracts:
    name: Contracts / ${{ matrix.group }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.origin == 'refresh-data' && '["core","data","knowledge"]' || inputs.origin == 'refresh-screener' && '["core","data"]' || '["core","data","knowledge","workspace","cloudflare"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all gates in shard
        env:
          # Failed headless shards emit FAILURE_LEDGER_JSON and a local JSON
          # report. Keep the cache/report paths outside the checkout so a
          # future approved artifact step can collect them without mutating
          # the tested revision.
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: node scripts/qa-runner.mjs --group ${{ matrix.group }} --no-cache

  browser:
    name: Browser / ${{ matrix.group }}
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: ${{ fromJSON(inputs.origin == 'refresh-data' && '["browser-unit","browser-runtime","browser-knowledge","browser-viewport"]' || inputs.origin == 'refresh-screener' && '["browser-unit","browser-runtime"]' || '["browser-unit","browser-runtime","browser-knowledge","browser-resilience","browser-viewport","browser-surface"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run all gates in shard
        run: node scripts/qa-runner.mjs --group ${{ matrix.group }} --no-cache

  attest:
    name: Attest exact tested release
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: [preflight, contracts, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Build immutable release attestation
        env:
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_ORIGIN: ${{ inputs.origin || 'source-push' }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$EXPECTED_SHA"
          node --input-type=module -e "import fs from 'node:fs'; const version=JSON.parse(fs.readFileSync('version.json','utf8')).version; fs.mkdirSync('.release',{recursive:true}); fs.writeFileSync('.release/aio-release-attestation.json', JSON.stringify({schemaVersion:'aio-release-attestation.v1',testedSha:process.env.EXPECTED_SHA,appRevision:version,origin:process.env.RELEASE_ORIGIN,runId:process.env.GITHUB_RUN_ID,repository:process.env.GITHUB_REPOSITORY,attestedAt:new Date().toISOString()},null,2)+'\n');"
      - name: Upload release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aio-release-attestation
          path: .release/aio-release-attestation.json
          if-no-files-found: error
          retention-days: 7
