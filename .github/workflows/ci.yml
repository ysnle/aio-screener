name: CI

# The manifest is the source of truth. Cheap gates must finish before expensive
# browser shards start; every shard reports independently so one failure does not
# hide the next one. Pages deployment lives in pages-deploy.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact bot-produced commit to validate and attest
        required: false
        type: string
      origin:
        description: Validation scope owner (refresh-data, refresh-screener or event-briefs)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_sha || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (cheap blocking gate)
    runs-on: ubuntu-latest
    # v59.78: a refresh run may wait up to 15 minutes here for the full push CI of the code under it.
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    # v59.59: the validation scope is decided once here. A refresh origin (a bot commit that changes only generated data)
    # runs the reduced contract set, skips the browser shards and is attested on top of a fully tested source commit.
    # The origin list used to be repeated in four expressions; event-briefs (v59.49) had to be added to each by hand.
    outputs:
      reduced_scope: ${{ steps.scope.outputs.reduced_scope }}
      contract_groups: ${{ steps.scope.outputs.contract_groups }}
      release_mode: ${{ steps.release-source.outputs.release_mode || 'direct' }}
      code_sha: ${{ steps.release-source.outputs.code_sha || '' }}
    steps:
      - name: Resolve validation scope
        id: scope
        env:
          ORIGIN: ${{ inputs.origin || '' }}
        run: |
          case "$ORIGIN" in
            refresh-data) reduced=true; groups='["core","data","knowledge"]' ;;
            refresh-screener|event-briefs) reduced=true; groups='["core","data"]' ;;
            *) reduced=false; groups='["core","data","knowledge","workspace","cloudflare"]'
               # Any other value validates the full scope, as before; name it so a typo in a dispatcher is visible.
               [ -n "$ORIGIN" ] && echo "::warning::unknown validation origin '$ORIGIN'; running the full scope" ;;
          esac
          { echo "reduced_scope=$reduced"; echo "contract_groups=$groups"; } >> "$GITHUB_OUTPUT"
          echo "origin=${ORIGIN:-source-push} reduced_scope=$reduced contract_groups=$groups"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          # A refresh run reads first-parent history to find the code it ships on (commits and trees only).
          fetch-depth: ${{ steps.scope.outputs.reduced_scope == 'true' && '0' || '1' }}
          filter: ${{ steps.scope.outputs.reduced_scope == 'true' && 'blob:none' || '' }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # v59.78 (automation audit 2026-11-08): a red code merge used to refuse every refresh release on top of it, so the
      # live data froze until the code was fixed (11/07 09:26-12:03Z and 13:25-16:45Z, 11/08 from 07:12Z). Now the code
      # under the refresh commit is either green (direct), still in CI (wait), or red: then the data rides on the newest
      # code commit that passed full push CI (overlay), and the contracts below test exactly that tree.
      - name: Resolve release source (refresh origin)
        id: release-source
        if: steps.scope.outputs.reduced_scope == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-release-source.mjs --sha "${{ inputs.release_sha || github.sha }}" --wait-min 15 --github-output
      # The preflight validates the tree Pages will ship too (the resolver above needs Node built-ins only, so the
      # dependencies are installed after the overlay, from the code commit's own lockfile).
      - name: Build the data overlay tree (preflight)
        if: steps.release-source.outputs.release_mode == 'overlay'
        run: |
          set -euo pipefail
          cp scripts/build-data-overlay.mjs "$RUNNER_TEMP/build-data-overlay.mjs"
          node "$RUNNER_TEMP/build-data-overlay.mjs" --code-sha "${{ steps.release-source.outputs.code_sha }}" --data-sha "${{ inputs.release_sha || github.sha }}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run aggregate preflight
        env:
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: node scripts/qa-runner.mjs --group preflight --no-cache
      - name: Upload redacted QA failure output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-qa-failure-output-preflight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-qa/runs/*/failure-output/*.txt
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: Contracts / ${{ matrix.group }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.preflight.outputs.contract_groups) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      # v59.78: test the tree Pages will ship. The builder is copied out first: the code commit may predate it.
      - name: Build the data overlay tree (last green code + this refresh's data)
        if: needs.preflight.outputs.release_mode == 'overlay'
        run: |
          set -euo pipefail
          cp scripts/build-data-overlay.mjs "$RUNNER_TEMP/build-data-overlay.mjs"
          node "$RUNNER_TEMP/build-data-overlay.mjs" --code-sha "${{ needs.preflight.outputs.code_sha }}" --data-sha "${{ inputs.release_sha || github.sha }}"
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore the producer-only SEC ledger for full-ledger gates (P1757)
        # sec-fundamentals.json lives on the data-store branch, not main. Restore it only when its digest equals this
        # checkout's projection manifest, so the gates compare the exact ledger that produced it; otherwise they run
        # the projection-only contract and print a labelled P1757 SKIP for the ledger comparisons.
        if: matrix.group == 'data'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sec-fundamentals-store.mjs restore --match-manifest
      - name: Run all gates in shard
        env:
          # Keep the runner reports and redacted failure sidecars outside the checkout.
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
          # v59.70 (I8): every contract shard, source pushes included, reports `liveData: content` gates and wall-clock date
          # judgements (ADVISORY / warning) instead of failing on them; producers and the watchdog still fail on them.
          # On 11-04 the fix push 432ac3eb failed only on data age and a 46-day document date, and no release could attest.
          AIO_QA_ORIGIN: ci
        run: node scripts/qa-runner.mjs --group ${{ matrix.group }} --no-cache
      - name: Upload redacted QA failure output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-qa-failure-output-contracts-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-qa/runs/*/failure-output/*.txt
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser / ${{ matrix.group }}
    # 2026-10-12: browser shards start beside the ~20 s contract shards instead of after them; attest still needs both.
    needs: preflight
    # v58.70 (owner 2026-10-23): a refresh commit changes only generated data on top of source code that already passed
    # the full push CI (the attest guard below proves it), so it is attested by the data/core/knowledge contracts alone.
    # Its browser shards depended on the apt mirror and held 10/22 04:50Z-23:20Z of data off the live site.
    # v59.49: event-briefs commits only public-data too; its full browser run failed the home text budget on brief text
    # (10-30 02:23Z, 16:43Z), so its releases were never attested.
    if: needs.preflight.outputs.reduced_scope != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: ["browser-unit","browser-runtime","browser-knowledge","browser-resilience","browser-viewport","browser-surface"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Read the pinned browser data
        # v59.70 (wave 2 A'): the browser gates of a source push read one pinned public-data snapshot
        # (architecture/browser-data-fixture.json) and a page clock set to its commit time, not the data bot's last
        # commit; watchdog-browser.yml runs the same gates on live data twice a day and alerts on a failure.
        id: browser-data
        run: |
          echo "sha=$(node scripts/browser-data-fixture.mjs sha)" >> "$GITHUB_OUTPUT"
          echo "AIO_BROWSER_CLOCK_AT=$(node scripts/browser-data-fixture.mjs clock)" >> "$GITHUB_ENV"
      - name: Cache the pinned browser data
        id: browser-data-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/aio-browser-data
          key: aio-browser-data-${{ steps.browser-data.outputs.sha }}-${{ hashFiles('architecture/browser-data-fixture.json') }}
      - name: Materialize the pinned browser data
        if: steps.browser-data-cache.outputs.cache-hit != 'true'
        env:
          PINNED_SHA: ${{ steps.browser-data.outputs.sha }}
          SNAPSHOT_DIR: ${{ runner.temp }}/aio-browser-data
        run: |
          git fetch --no-tags --depth=1 origin "$PINNED_SHA"
          node scripts/browser-data-fixture.mjs materialize --out "$SNAPSHOT_DIR"
      - name: Install the pinned browser data
        # Written over this throwaway checkout's public-data/, so the gates that also read public-data from disk see
        # the same files the local server serves. Every file's blob id is checked against the pin first.
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/aio-browser-data
        run: node scripts/browser-data-fixture.mjs install --from "$SNAPSHOT_DIR" --overwrite-public-data
      - name: Set up the browser gates
        # Playwright Chromium and its OS packages (cached); each workaround's history is in the action.
        uses: ./.github/actions/setup-browser-gates
      - name: Run all gates in shard
        # v59.72 (P2266, owner 11/07): one flaky browser gate on a push left every later data release unattested until the
        # next push. A failed shard reruns only its failed gates once; a gate that fails twice fails the shard.
        env:
          AIO_QA_CACHE_DIR: ${{ runner.temp }}/aio-qa
        run: |
          node scripts/qa-runner.mjs --group ${{ matrix.group }} --no-cache && exit 0
          echo "::warning::${{ matrix.group }} failed once; rerunning only the failed gates"
          node scripts/qa-runner.mjs rerun-failed --no-cache
          echo "::warning::${{ matrix.group }} passed on rerun (flaky gate; the first failure is in this log)"
      - name: Upload redacted QA failure output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-qa-failure-output-browser-${{ matrix.group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-qa/runs/*/failure-output/*.txt
          if-no-files-found: ignore
          retention-days: 7

  attest:
    name: Attest exact tested release
    # v58.70: a skipped browser job counts only for a refresh origin; every other run still needs it to succeed.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref_name == 'main'
      && needs.preflight.result == 'success' && needs.contracts.result == 'success'
      && (needs.browser.result == 'success' || (needs.browser.result == 'skipped' && needs.preflight.outputs.reduced_scope == 'true'))
    needs: [preflight, contracts, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          # Commits and trees only: the attestation needs ancestry and a name-only diff, not file contents (48 s -> seconds).
          filter: blob:none
      # v58.20 review B2: a refresh-dispatched run tests a reduced group set, but the commit it attests contains every
      # human commit the refresh was rebased onto. The newest commit that changes anything outside the refresh-generated
      # paths must already have a successful full push CI; otherwise this release waits for that run to attest it.
      # First-parent history: push CI runs on the merge commit main received, not on the merged branch's own commits.
      - name: Reduced-scope release sits on a fully tested source commit
        if: needs.preflight.outputs.reduced_scope == 'true'
        env:
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
          CODE_SHA: ${{ needs.preflight.outputs.code_sha }}
          GH_TOKEN: ${{ github.token }}
        # v59.78: the P1952 treesame rule and the first-parent source lookup live in resolve-release-source.mjs. Preflight
        # chose direct (this commit's own code passed full push CI) or overlay (the data rides on CODE_SHA, the newest code
        # that did); this re-check, without waiting, refuses a choice that no longer verifies.
        run: node scripts/resolve-release-source.mjs --sha "$EXPECTED_SHA" --verify-code-sha "$CODE_SHA"
      - name: Build immutable release attestation
        env:
          EXPECTED_SHA: ${{ inputs.release_sha || github.sha }}
          RELEASE_ORIGIN: ${{ inputs.origin || 'source-push' }}
          RELEASE_MODE: ${{ needs.preflight.outputs.release_mode }}
          CODE_SHA: ${{ needs.preflight.outputs.code_sha }}
          AUTO_WORKER_DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getWorkerChangesBetween } from './scripts/worker-deploy-impact.mjs';
          const workerDeploy = process.env.AUTO_WORKER_DEPLOY === 'true'
            ? await getWorkerChangesBetween(process.env.PUSH_BEFORE_SHA, process.env.EXPECTED_SHA)
            : { dataPlane: false, aiProxy: false };
          import { execFileSync } from 'node:child_process';
          // v59.78: an overlay release ships the code of CODE_SHA, so it carries that code's version.
          const overlay = process.env.RELEASE_MODE === 'overlay';
          const versionSource = overlay ? execFileSync('git', ['show', `${process.env.CODE_SHA}:version.json`], { encoding: 'utf8' }) : fs.readFileSync('version.json', 'utf8');
          const version = JSON.parse(versionSource).version;
          fs.mkdirSync('.release', { recursive: true });
          fs.writeFileSync('.release/aio-release-attestation.json', JSON.stringify({
            schemaVersion: 'aio-release-attestation.v1',
            testedSha: process.env.EXPECTED_SHA,
            appRevision: version,
            origin: process.env.RELEASE_ORIGIN,
            releaseMode: overlay ? 'data-overlay' : 'direct',
            ...(overlay ? { codeSha: process.env.CODE_SHA } : {}),
            runId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            workerDeploy,
            attestedAt: new Date().toISOString()
          }, null, 2) + '\n');
          NODE
      - name: Upload release attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aio-release-attestation
          path: .release/aio-release-attestation.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
