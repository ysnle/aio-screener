name: CI

# 왜: 836개 런타임 테스트·200+ 규칙이 전부 "브라우저 콘솔 수동 실행"이라, P311(구문 오류로
# 파이프라인 전체 마비)·버전 누락·stray 파일이 push 시점에 안 걸렸다. 이 게이트가 push/PR마다
# (1) 전 JS/스크립트 구문 검사 (2) 버전 동기화 7곳+캐시버스터 (3) stray 파일을 검증한다.
# main push에서 실패하면 GitHub가 소유자에게 자동 이메일 → 회귀를 분 단위로 포착.
# (데이터 신선도는 refresh-data.yml + data-watchdog.yml 담당. 여기서 fetch를 실행하면 Yahoo에
#  push마다 74요청이 추가돼 IP 차단을 악화시키므로 구문 검사만 한다.)
# v50.25/WO-8
# v51.95/R272: `on.workflow_run` 추가 — refresh-data.yml의 GITHUB_TOKEN 커밋이 이 워크플로의
# `push` 트리거를 못 울려 validate/deploy가 통째로 건너뛰어지던 문제(아래 `on:` 블록 주석 참조)를
# PAT 없이 해소.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  # P590-followup/R272: GitHub does not let a push made with the default GITHUB_TOKEN trigger
  # further `on: push` workflow runs (anti-recursion safeguard, documented GitHub Actions
  # behavior — not something [skip ci] removal fixes). refresh-data.yml's every-30-minute
  # commits use exactly that token, so this workflow's `push` trigger above silently never
  # fired for them — validate/deploy never ran, and the live site quietly went stale for
  # ~19h until the next human-initiated push happened to redeploy it (found live 2026-07-03,
  # data.json 2026-07-02T06:10 vs a 2026-07-03T01:04 watchdog check). `workflow_run` is exempt
  # from that restriction — it fires on completion of the named workflow regardless of what
  # authored the commits inside it — so this closes the gap without a PAT/new secret.
  workflow_run:
    workflows: ['Refresh market data']
    types: [completed]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Skip entirely if a workflow_run trigger's source run itself failed — nothing new/valid
    # to validate or deploy in that case (refresh-data.yml may not have even committed).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # ↓↓↓ P557/R248: validate must fully pass before the deploy job below is allowed to
      # run — this is the whole point of this change. Do not add `continue-on-error` to any
      # step here without also revisiting deploy's `needs: validate` gate.
      # P602/R278: workflow_run.head_sha is fixed to the commit the triggering run *started*
      # from, not any commit it pushed during its own run (GitHub's documented behavior) — so
      # every bot data-commit cycle had CI validate/deploy the *previous* cycle's tree instead
      # of its own (FABLE-LIVE-AUDIT-2026-07-04.md P0). head_branch (= main) checks out the
      # branch's actual current head at checkout time, i.e. the commit this run is really about.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 구문 검사 (전 클라이언트 스크립트 — P311 재발 방지)
        run: |
          set -e
          for f in js/*.js; do
            echo "--check $f"
            node --check "$f"
          done

      - name: 데이터/CI 스크립트 구문 검사 (.mjs)
        run: |
          set -e
          for f in scripts/*.mjs; do
            echo "--check $f"
            node --check "$f"
          done

      - name: 버전 동기화 검증 (R1 7곳 + 캐시버스터 6곳)
        run: node scripts/ci-version-check.mjs

      - name: Structural regression checks
        run: node scripts/ci-structural-check.mjs

      - name: Default-path UX checks
        run: node scripts/ci-ux-default-path-check.mjs

      - name: Runtime contract checks
        run: node scripts/ci-runtime-contract-check.mjs

      - name: Data pipeline contract checks
        run: node scripts/ci-data-pipeline-contract-check.mjs

      - name: Semantic review checks
        run: node scripts/ci-semantic-review-check.mjs

      - name: Workflow compaction checks
        run: node scripts/ci-workflow-compaction-check.mjs

      - name: Skill contract checks
        run: node scripts/ci-skill-contract-check.mjs

      - name: stray 임시/백업 파일 검사
        run: |
          set -e
          STRAY=$(git ls-files | grep -E '(\.git-msg.*|.*\.tmp|.*~|.*\.bak|.*\.orig|.*\.rej)$' || true)
          if [ -n "$STRAY" ]; then
            echo "❌ 추적된 stray 임시/백업 파일 발견:"; echo "$STRAY"; exit 1
          fi
          echo "✅ stray 파일 없음"

  # Phase 2 [B5] (FABLE-SYSTEM-DIAGNOSIS-2026-07-02.md §4): the 900+ in-browser unit tests in
  # js/aio-tests.js (AIO.runTests()) previously only ran via manual browser console — runtime
  # regressions (render/state/contract breaks, distinct from the syntax-only checks above) sailed
  # through `validate` and were found live. This job serves the app headlessly with Playwright and
  # runs the real suite. Deliberately NOT a step inside `validate` and NOT in deploy's `needs:` —
  # 27 known pre-existing failures (market-data/calendar/version drift + a few latent UX/a11y
  # findings, see _context/GATE-BASELINE-2026-07-03.md) are still open, so this is report-only
  # until they're triaged. `continue-on-error` here is intentional; do not remove it without first
  # clearing _context/gate-baseline-skip-list.json down to zero.
  # CURRENT v52.22: skip-list is empty and headless-tests is a blocking deploy gate.
  headless-tests:
    name: Headless unit tests (AIO.runTests())
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run AIO.runTests() headlessly
        run: node scripts/ci-headless-tests.mjs

  viewport-matrix:
    name: Viewport route matrix (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run route x viewport surface matrix
        run: node scripts/ci-viewport-matrix-check.mjs

  # P557/R248: GitHub Pages was on "legacy" branch-deploy, which republishes whatever is on
  # main the instant it's pushed — completely independent of whether `validate` above passed
  # or failed (confirmed live: 33% of recent CI runs failed, some of those pushes went live
  # anyway). This job makes deployment depend on `validate` succeeding first via `needs:`,
  # so a broken push simply does not update the live site instead of deploying broken.
  # CURRENT v52.22: deployment also depends on the blocking headless-tests job.
  deploy:
    name: Deploy to GitHub Pages (gated on validate + headless)
    needs: [validate, headless-tests]
    # Deploy on a direct human/session push to main, OR on a successful refresh-data.yml run
    # completing on main (the workflow_run path this comment block's `on:` note added — see
    # above). workflow_dispatch and pull_request never deploy.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}

      # Legacy branch-deploy ran the repo root through Jekyll, which by default silently
      # excludes any dotfile/dot-directory and any underscore-prefixed file/directory
      # (_context, _archive, _backup, .github, .claude, .agents, .git, ...) even with no
      # _config.yml present. actions/upload-pages-artifact does not run Jekyll and has no
      # such default, so uploading the raw checkout would newly expose all of that internal
      # content publicly. This staging step reproduces Jekyll's dot/underscore exclusion
      # exactly, so the public surface stays identical to what main already serves today.
      - name: Stage public site (replicate Jekyll dot/underscore exclusion)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/pages-dist"
          rsync -a --exclude='.*' --exclude='_*' ./ "$RUNNER_TEMP/pages-dist/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # P600-followup: `actions/deploy-pages` intermittently fails with "Deployment failed,
      # try again later." (a GitHub-side Pages deploy API issue — validate/tests pass every
      # time this happens, and it's not correlated with an overlapping deploy on this repo).
      # Measured 2026-07-04: 4 of the last 16 workflow_run-triggered deploys (25%) hit this.
      # Each unretried failure leaves the live site behind the latest data commit until the
      # next refresh-data.yml cycle (up to ~30min, longer if that cycle's deploy also fails),
      # which data-watchdog.yml's live-freshness check then separately flags as its own
      # failed run. A single retry absorbs most of these in place instead of waiting for the
      # next cycle (or the next few) to self-heal.
      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail if both deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: |
          echo "::error::GitHub Pages deploy failed twice in a row (initial attempt + retry)."
          exit 1
