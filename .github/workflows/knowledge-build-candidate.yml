name: Knowledge build candidate

on:
  pull_request:
    paths:
      - 'content/**'
      - 'js/aio-glossary.js'
      - 'public-data/atlas/**'
      - 'public-data/knowledge/**'
      - 'public-data/masters/holdings.json'
      - 'public-data/masters/history-holdings.json'
      - 'public-data/masters/index.json'
      - 'public-data/principles/**'
      - 'src/ui/pages/principles.js'
      - 'src/ui/pages/atlas.js'
      - 'src/ui/knowledge/learning-controls.js'
      - 'src/app/knowledge-route-state.js'
      - 'src/domain/knowledge/**'
      - 'scripts/build-13f-issuer-aggregates.mjs'
      - 'scripts/lib/atomic-write.mjs'
      - 'scripts/lib/13f-semantic-hash.mjs'
      - 'scripts/*knowledge*.mjs'
      - 'scripts/build-atlas-*.mjs'
      - 'scripts/build-principles-*.mjs'
      - 'scripts/audit-knowledge-*.mjs'
      - 'scripts/enrich-knowledge-*.mjs'
      - 'scripts/ci-knowledge-generated-parity-check.mjs'
      - '.github/workflows/knowledge-build-candidate.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: knowledge-build-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build generated candidates in a disposable workspace
        env:
          AIO_SOURCE_SHA: ${{ github.sha }}
          AIO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CANDIDATE_DIR: ${{ runner.temp }}/aio-knowledge-build-candidate-${{ github.run_id }}
        run: node scripts/ci-knowledge-generated-parity-check.mjs --candidate-dir "$CANDIDATE_DIR"

      - name: Upload human-review candidate artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge-build-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aio-knowledge-build-candidate-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
