name: CodeQL

# v59.80 (hosting review 2026-11-08): the repository default setup analysed every push, 409 runs in 7 days (the largest
# Actions consumer), and 312 of those commits were the data bot's public-data refreshes, which change no code. This
# advanced setup analyses the same languages on code changes only, plus a weekly full scan. Python lives only in
# _artifacts one-off scripts, so it is not analysed.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public-data/**'
      - '_artifacts/**'
      - '_context/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'public-data/**'
      - '_artifacts/**'
      - '_context/**'
      - '**/*.md'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['actions', 'javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - public-data
              - _artifacts
              - node_modules
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
